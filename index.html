<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Nani · Cuentas</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d9;--ac:#2f6f5e;--ok:#1f7a4d;--bad:#b3392f;--wn:#a86a0f;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#a09f97;--bd:#3a3a36;--ac:#5fb59f;--ok:#58c28a;--bad:#ef7a6f;--wn:#e0a64a;--on:#10201b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#a09f97;--bd:#3a3a36;--ac:#5fb59f;--ok:#58c28a;--bad:#ef7a6f;--wn:#e0a64a;--on:#10201b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 14px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.hd img{width:52px;height:52px;border-radius:50%;flex:none;background:#fff}
.hd h1{margin:0}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;padding:9px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:12px;white-space:nowrap;min-width:85px}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.wk div{text-align:center;display:flex;flex-direction:column}
.wk button{width:44px;height:40px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.k span{display:block;font-size:12px;color:var(--mu)}
.k b{font-size:18px}
.k.bal{grid-column:1/-1}
.k.bal b{font-size:24px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.card > .row input:nth-child(3){grid-column:1/-1}
.ro .it button{display:none}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.chk input{width:auto;margin:0}
.pri{width:100%;padding:11px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}
.it .t small{display:block;color:var(--mu)}
.it button{border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}
.bd{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--wn);color:var(--wn);margin-left:6px;background:none}
.bd.ok{border-color:var(--ok);color:var(--ok)}
.bd.bad{border-color:var(--bad);color:var(--bad)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:12px}
tfoot td{font-weight:700;border-bottom:0}
.lo{margin-left:auto;border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}

.label-box { 
  width: 5.6in; 
  height: 3.7in; 
  border: 2px solid #000; 
  padding: 12px 20px; 
  border-radius: 6px; 
  background: #fff; 
  color: #000; 
  font-family: Arial, sans-serif;
  box-sizing: border-box;
  position: relative;
}
.sender-container {
  position: absolute;
  top: 15px;
  left: 20px;
}
.sender-title {
  font-weight: bold;
  font-size: 11px;
  margin-bottom: 2px;
}
.sender-box {
  border: 1.5px solid #000;
  padding: 6px 8px;
  width: 240px;
  font-size: 10px;
  line-height: 1.2;
}
.dest-title {
  font-weight: bold;
  font-size: 18px;
  text-align: center;
  margin-bottom: 6px;
}
.dest-container {
  position: absolute;
  bottom: 15px;
  left: 20px;
  right: 20px;
  font-size: 17px;
  line-height: 1.4;
}
#print-label-area{display:none}
@page{margin:10mm}
@media print{.label-box:not(:last-child){break-after:page;page-break-after:always}body>*:not(#print-label-area){display:none!important}#print-label-area{display:block!important}body{background:#fff}}
</style>

  var rd = new FileReader();
  rd.onload = function() {
    var rows = csv(String(rd.result));
    var out = [];
    
    rows.slice(1).forEach(function(r) {
      var num = (r[0] || '').trim();
      var fechaStr = (r[1] || '').trim();
      var fecha = today();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(fechaStr)) {
        var p = fechaStr.split('/');
        fecha = p[2] + '-' + p[1] + '-' + p[0];
      } else if (/^\d{4}-\d\d-\d\d$/.test(fechaStr)) {
        fecha = fechaStr;
      }

      var nombre = (r[4] || '').trim();
      var tel = (r[5] || '').trim();
      var desc = (r[6] || '').trim();

      var pagado = parseFloat(String(r[8] || '').replace(',', '.')) || 0;

      if (!nombre || !(monto > 0)) return;

      var uniqueKey = (num ? num : '') + '|' + nombre.toLowerCase() + '|' + fecha;
      var id = 'cr-' + hs(uniqueKey);
      
      out.push({
        id: id,
        num: num,
        nombre: nombre,
        tel: tel,
        desc: desc,
        plazo: plazo,
        monto: Math.round(monto * 100) / 100,
        pagado: Math.round(pagado * 100) / 100,

      (function nx() {

function expReporteProveedoresCSV(){
  var jd=String(Q.j||'').replace(/\D/g,''),qq=Q.q.trim().toLowerCase(),a=parseFloat(String(Q.a).replace(',','.')),b=parseFloat(String(Q.b).replace(',','.'));
  var l=S.items.filter(function(i){return (!Q.t||i.t===Q.t)&&(!Q.c||i.c===Q.c)&&(!qq||(i.t==='f'&&(i.n||'').trim().toLowerCase()===qq))&&(isNaN(a)||i.a>=a)&&(isNaN(b)||i.a<=b)&&(!Q.f||i.d>=Q.f)&&(!Q.h||i.d<=Q.h)&&(!jd||String(i.j||'').replace(/\D/g,'')===jd)});
  
  var facturasFiltradas = l.filter(function(i){ return i.t === 'f'; });
  var provMap = {};

  facturasFiltradas.forEach(function(f){
    var provName = (f.n || '').trim() || 'Sin proveedor';
    var cedula = (f.j || '').trim();
    if(!provMap[provName]){
      provMap[provName] = { elec: 0, noElec: 0, cedula: cedula };
    } else if(!provMap[provName].cedula && cedula) {
      provMap[provName].cedula = cedula;
    }
    if(f.e){
      provMap[provName].elec += f.a;
    } else {
      provMap[provName].noElec += f.a;
    }
  });

  var qEsc=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
  var rows = [['Proveedor', 'Cédula Jurídica', 'Total Facturas Electrónicas', 'Total Facturas No Electrónicas', 'Total General']];
  
  Object.keys(provMap).sort().forEach(function(prov){
    var item = provMap[prov];
    var totalProv = item.elec + item.noElec;
    rows.push([prov, item.cedula, item.elec, item.noElec, totalProv]);
  });

  var b = new Blob(['\ufeff'+rows.map(function(r){return r.map(qEsc).join(',')}).join('\n')],{type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'reporte-facturas-proveedores-'+shDot(today()).replace(/\//g,'-')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

  var num = $('cr_num').value.trim();

  var id = edCrId || ('cr-' + hs(uniqueKey));

function abonarCredito(id){
  if(BUSY[id]) return;
  var el = $('abono_' + id);
  if(!el) return;
  var abono = parseFloat(String(el.value).replace(',','.'));
  if(!(abono > 0)){
    $('st').textContent = 'Escribe un monto de abono válido';
    return;
  }

  var cr = S.creditos.find(function(c){ return c.id === id; });
  if(cr){
    var pendiente = Math.round((cr.monto - cr.pagado)*100)/100;
    if(abono > pendiente) abono = pendiente;
    abono = Math.round(abono*100)/100;
    if(!(abono > 0)){ $('st').textContent = 'Este apartado ya está pagado'; return; }

    if(DB && firebase.firestore && firebase.firestore.FieldValue){
      var vb = ventaAbono(cr, abono, today());
      var bb = FS.batch();
      bb.update(FS.doc(P + 'creditos/' + id), { pagado: firebase.firestore.FieldValue.increment(abono) });
      bb.set(FS.doc(P + 'items/' + vb.id), vb);
      BUSY[id] = true;
      setTimeout(function(){ BUSY[id] = false; }, 8000);
      $('st').textContent = 'Guardando abono…';
      bb.commit().then(function(){
        BUSY[id] = false;
        $('st').textContent = 'Abono registrado correctamente';
        render();
      }).catch(function(e){
        BUSY[id] = false;
        $('st').textContent = 'Error al registrar abono: ' + e.message;
      });
    }
  }
}

  var c=$('creditos_list_container');if(c)c.innerHTML=renderCreditosList();
}
function mensajeAtraso(c){
  var pend=Math.round((c.monto-c.pagado)*100)/100,lim=addDays(c.fecha,parseInt(c.plazo)||0);
  var dias=Math.round((new Date(today()+'T00:00')-new Date(lim+'T00:00'))/86400000);
  return '¡Hola '+c.nombre+'! 👋 Le escribimos de *Little Nani* para recordarle que el plazo de su apartado'+(c.num?' #'+c.num:'')+' venció el '+shDot(lim)+' (hace '+dias+(dias===1?' día':' días')+').\n\n'
    +'📦 *Descripción:* '+(c.desc||'Apartado general')+'\n'
    +'💰 *Monto total:* ₡'+money(c.monto)+'\n'
    +'✅ *Abonado:* ₡'+money(c.pagado)+'\n'
    +'⏳ *Saldo pendiente:* ₡'+money(pend)+'\n\n'
    +'Quedamos atentos para coordinar su pago o cualquier consulta. ¡Muchas gracias! ✨';
}
function cerrarRM(){RM=null;$('rm_panel').innerHTML=''}
function panelRM(){
  if(!RM)return '';
  var h='<div class="card" style="border:2px solid var(--ac)"><b>Recordatorios por WhatsApp</b>';
  if(RM.i<RM.cola.length){
    h+='<p class="mu" style="margin:6px 0">Enviados '+RM.i+' de '+RM.cola.length+'. Siguiente: <b>'+esc(RM.cola[RM.i].nombre)+'</b></p><button class="pri" onclick="enviarSiguienteRecordatorio()">📤 Enviar al siguiente</button>';
  }else{
    h+='<p class="mu" style="margin:6px 0">'+(RM.cola.length?'Listo: se abrieron '+RM.cola.length+' recordatorios.':'Ninguno de los atrasados tiene teléfono registrado.')+'</p>';
  }
  if(RM.sin.length)h+='<p class="mu" style="margin:8px 0 0">Sin teléfono (no se pudo enviar): '+RM.sin.map(esc).join(', ')+'</p>';
  return h+'<button class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="cerrarRM()">Cerrar</button></div>';
}
function iniciarRecordatorios(){
  var l=atrasados().sort(function(a,b){return (parseInt(String(a.num).replace(/\D/g,''))||0)-(parseInt(String(b.num).replace(/\D/g,''))||0)});
  var cola=l.filter(function(c){return String(c.tel||'').replace(/\D/g,'').length>=8}),sin=l.filter(function(c){return cola.indexOf(c)<0}).map(function(c){return c.nombre});
  if(!l.length){$('st').textContent='No hay apartados atrasados';return}
  if(!cola.length){RM={cola:[],i:0,sin:sin};$('rm_panel').innerHTML=panelRM();return}
  if(!confirm('Se abrirá WhatsApp con el recordatorio para '+cola.length+' cliente(s) atrasado(s), uno por uno. ¿Continuar?'))return;
  RM={cola:cola,i:0,sin:sin};
  enviarSiguienteRecordatorio();
}
function enviarSiguienteRecordatorio(){
  if(!RM||RM.i>=RM.cola.length)return;
  var c=RM.cola[RM.i],t=String(c.tel).replace(/\D/g,'');
  if(t.length===8)t='506'+t;
  RM.i++;
  window.open('https://api.whatsapp.com/send?phone='+t+'&text='+encodeURIComponent(mensajeAtraso(c)),'_blank');
  $('rm_panel').innerHTML=panelRM();
}
function filterCreditos(el){
  CR_Q = el.value.trim().toLowerCase();
  CR_Limit = 50;
  var container = $('creditos_list_container');
  if(container) container.innerHTML = renderCreditosList();
}

function cargarMasCreditos(){
  CR_Limit += 50;
  var container = $('creditos_list_container');
  if(container) container.innerHTML = renderCreditosList();
}

function renderCreditosList(){
  var sortedCreditos = S.creditos.slice().sort(function(a, b){
    var numA = parseInt(String(a.num || '').replace(/\D/g, '')) || 0;
    var numB = parseInt(String(b.num || '').replace(/\D/g, '')) || 0;
    if(numA !== numB) return numA - numB;
    return (a.fecha || '').localeCompare(b.fecha || '');
  });

  var filtered = sortedCreditos.filter(function(c){
    if(CR_Atr && !crAtr(c)) return false;
    if(!CR_Q) return true;
    var n = c.nombre.toLowerCase();
    var t = (c.tel || '').toLowerCase();
    var num = (c.num || '').toLowerCase();
    return n.indexOf(CR_Q) >= 0 || t.indexOf(CR_Q) >= 0 || num.indexOf(CR_Q) >= 0;
  });

  if(!filtered.length){
    return '<div class="card"><p class="mu" style="margin:4px 0">'+(CR_Atr&&!CR_Q?'No hay apartados atrasados 🎉':'No se encontraron apartados con ese número, nombre o teléfono.')+'</p></div>';
  }

  var paginated = filtered.slice(0, CR_Limit);

  var html = paginated.map(function(c){
    var pendiente = Math.round((c.monto - c.pagado) * 100) / 100;
    var diasPlazo = parseInt(c.plazo) || 0;
    var fechaLimite = diasPlazo > 0 ? addDays(c.fecha, diasPlazo) : '';
    var isAtrasado = (diasPlazo > 0 && pendiente > 0 && fechaLimite < today());
    
    var estado = pendiente <= 0 ? '<span class="bd ok">Pagado</span>' : (isAtrasado ? '<span class="bd bad">⚠️ Atrasado</span>' : '<span class="bd">Pendiente</span>');
    
    var cardHtml = '<div class="card">'
       + '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div>'
       + (c.num ? '<small class="mu" style="font-weight:600">NÚMERO DE APARTADO: #' + esc(c.num) + '</small>' : '')
       + '<b>'+esc(c.nombre)+'</b> '+estado
       + '<small class="mu">Inicio: '+shDot(c.fecha)+(diasPlazo ? ' · Plazo: ' + diasPlazo + ' días (Vence: ' + shDot(fechaLimite) + ')' : '')+(c.tel?' · Tel: '+esc(c.tel):'')+'</small>'
       + '<small>'+esc(c.desc||'Sin descripción')+'</small>'
       + '</div><div style="display:flex;gap:4px"><button style="border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 8px;font-size:12px" onclick="editCredito(\''+c.id+'\')">Editar</button><button style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:4px 8px;font-size:12px" onclick="eliminarCredito(\''+c.id+'\')">Eliminar</button></div></div>'
       + '<div style="margin-top:8px;display:flex;justify-content:space-between;font-size:14px"><span>Total: <b>'+money(c.monto)+'</b></span><span>Abonado: <b class="pos">'+money(c.pagado)+'</b></span><span>Resta: <b class="neg">'+money(pendiente)+'</b></span></div>';
    
    cardHtml += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">';
    if(pendiente > 0){
      cardHtml += '<input id="abono_'+c.id+'" type="number" inputmode="decimal" step="0.01" placeholder="Monto a abonar" style="margin:0">'
         + '<button class="pri" style="width:auto;padding:0 14px" onclick="abonarCredito(\''+c.id+'\')">Abonar</button>';
    }
    cardHtml += '<button class="pri" style="width:auto;padding:0 14px;background:var(--ok);color:#fff" onclick="enviarReporteCliente(\''+c.id+'\')">📤 Enviar Reporte</button>';
    cardHtml += '<button class="pri" style="width:auto;padding:8px 14px;background:var(--ac)" onclick="imprimirReciboApartado(\''+c.id+'\')">🧾 Recibo</button>';
    cardHtml += '</div>';

    cardHtml += '</div>';
    return cardHtml;
  }).join('');

  if(filtered.length > CR_Limit){
    html += '<button type="button" class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);margin-top:8px" onclick="cargarMasCreditos()">Cargar más apartados (' + (filtered.length - CR_Limit) + ' restantes)</button>';
  }

  return html;
}

    totalDeuda += c.monto;

  });

  var edObj = edCrId ? S.creditos.find(function(c){ return c.id === edCrId; }) : null;

  var sugeridoNum = '';
  if(!edObj && S.creditos.length > 0){
    var maxNum = 0;
    S.creditos.forEach(function(c){
      var n = parseInt(String(c.num || '').replace(/\D/g, '')) || 0;
      if(n > maxNum) maxNum = n;
    });
    sugeridoNum = (maxNum + 1).toString();
  } else if(!edObj) {
    sugeridoNum = '1';
  }

  var h = '<div class="grid">'
        + '<div class="k"><span>Total Apartado (Acumulado)</span><b>'+money(totalDeuda)+'</b></div>'
        + '<div class="k"><span>Total por Cobrar (Pendiente)</span><b class="neg">'+money(totalPendiente)+'</b></div>'
        + '</div>'
        + '<div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap">'
        + '<button class="pri" style="flex:1;background:var(--ac)" onclick="expCreditos()">Exportar Reporte a Excel (CSV)</button>'
        + '<label class="pri" style="flex:1;display:block;text-align:center;background:none;color:var(--tx);border:1px solid var(--bd);cursor:pointer">Importar Apartados (CSV)<input type="file" accept=".csv,text/csv" style="display:none" onchange="impCreditos(this)"></label>'
        + '<button class="pri" style="flex:1;background:none;color:var(--bad);border:1px solid var(--bad)" onclick="deleteAllCreditos()">🗑️ Borrar Todos los Apartados</button>'
        + '</div>'
        + '<h2>'+(edObj ? 'Editar apartado' : 'Registrar nuevo apartado')+'</h2>'
        + '<div class="card">'
        + '<div class="row">'
        + '<input id="cr_num" placeholder="Núm. de apartado" value="'+(edObj ? esc(edObj.num||'') : esc(sugeridoNum))+'">'
        + '<input id="cr_plazo" type="number" inputmode="numeric" placeholder="Plazo máximo (días)" value="'+(edObj ? esc(edObj.plazo||'') : '')+'">'
        + '</div>'
        + '<input id="cr_nombre" placeholder="Nombre del cliente" value="'+(edObj ? esc(edObj.nombre||'') : '')+'">'
        + '<input id="cr_tel" placeholder="Teléfono" inputmode="tel" value="'+(edObj ? esc(edObj.tel||'') : '')+'">'
        + '<input id="cr_desc" placeholder="Descripción de la compra (ej: Ropa, zapatos...)" value="'+(edObj ? esc(edObj.desc||'') : '')+'">'
        + '<div class="row">'
        + '<input type="date" id="cr_fecha" value="'+(edObj ? edObj.fecha : today())+'">'
        + '<input id="cr_monto" inputmode="decimal" step="0.01" min="0" placeholder="Monto total de compra" value="'+(edObj ? edObj.monto : '')+'">'
        + '<input id="cr_pagado" inputmode="decimal" step="0.01" min="0" placeholder="Abono inicial (adelanto)" value="'+(edObj ? esc(edObj.pagado||''):'')+'">'
        + '</div>'
        + '<button class="pri" onclick="saveCreditoItem()">'+(edObj ? 'Guardar Cambios' : 'Registrar Apartado')+'</button>'
        + (edObj ? '<button class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="cancelEditCredito()">Cancelar</button>' : '')
        + '</div>'
        + (function(){
            var at=atrasados(),tv=at.reduce(function(a,c){return a+(c.monto-c.pagado)},0);
            return '<div class="card"><div class="grid"><div class="k"><span>Apartados atrasados</span><b class="'+(at.length?'neg':'')+'">'+at.length+'</b></div><div class="k"><span>Total vencido</span><b class="neg">'+money(tv)+'</b></div></div>'
              +'<label class="chk" style="margin-top:10px"><input type="checkbox" '+(CR_Atr?'checked':'')+' onchange="toggleAtrasados(this)"> Mostrar solo atrasados</label>'
              +(at.length?'<button class="pri" style="background:var(--ok);color:#fff" onclick="iniciarRecordatorios()">📲 Recordatorio por WhatsApp a todos los atrasados ('+at.length+')</button>':'')
              +'</div><div id="rm_panel">'+panelRM()+'</div>';
          })()
        + '<h2>Buscar cliente</h2>'
        + '<input type="text" id="cr_search" placeholder="Buscar por número, nombre o teléfono..." value="'+esc(CR_Q)+'" oninput="filterCreditos(this)">'
        + '<h2>Reporte y listado de apartados activos</h2>'
        + '<div id="creditos_list_container">' + renderCreditosList() + '</div>';

  return h;
}

var dvArticulosTemp = [];

function agregarArticuloTemp(desc, precio){
  dvArticulosTemp.push({desc: desc || '', precio: parseFloat(precio) || 0});
  renderArticulosTempList();
}

function quitarArticuloTemp(index){
  dvArticulosTemp.splice(index, 1);
  renderArticulosTempList();
}

function renderArticulosTempList(){
  var container = $('dv_articulos_container');
  if(!container) return;
  if(!dvArticulosTemp.length){
    container.innerHTML = '<p class="mu">Aún no hay artículos agregados.</p>';
    actualizarTotalVentaCalculado();
    return;
  }
  var html = dvArticulosTemp.map(function(art, idx){
    return '<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">'
      + '<input type="text" placeholder="Nombre/Descripción del artículo" value="'+esc(art.desc)+'" oninput="dvArticulosTemp['+idx+'].desc=this.value" style="margin:0;flex:2">'
      + '<input type="number" inputmode="decimal" step="0.01" placeholder="Precio" value="'+(art.precio || '')+'" oninput="dvArticulosTemp['+idx+'].precio=parseFloat(this.value)||0; actualizarTotalVentaCalculado();" style="margin:0;flex:1">'
      + '<button type="button" style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:8px 12px" onclick="quitarArticuloTemp('+idx+')">✕</button>'
      + '</div>';
  }).join('');
  container.innerHTML = html;
  actualizarTotalVentaCalculado();
}

function actualizarTotalVentaCalculado(){
  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var envio = parseFloat($('dv_envio') ? $('dv_envio').value : 0) || 0;
  var total = subtotal + envio;
  if($('dv_total_preview')) $('dv_total_preview').textContent = '₡' + money(total);
}

function saveDetalleVentaItem(){
  var fecha = $('dv_fecha').value || today();
  var nombre = $('dv_nombre').value.trim();
  var tel = $('dv_tel').value.trim();
  var provincia = $('dv_provincia').value.trim();
  var canton = $('dv_canton').value.trim();
  var distrito = $('dv_distrito').value.trim();
  var otrosDatos = $('dv_otros').value.trim();
  var envio = parseFloat(String($('dv_envio').value).replace(',','.')) || 0;
  var guia = $('dv_guia').value.trim();

  if(!nombre){
    $('st').textContent = 'Indica el nombre del cliente';
    return;
  }
  if(!dvArticulosTemp.length){
    $('st').textContent = 'Agrega al menos un artículo a la venta';
    return;
  }
  
  var invalidArt = dvArticulosTemp.some(function(art){ return !art.desc.trim() || !(art.precio > 0); });
  if(invalidArt){
    $('st').textContent = 'Todos los artículos deben tener descripción y un precio mayor a 0';
    return;
  }

  if(guia){
    var duplicada = S.items.find(function(item){
      return item.t === 'v' && item.dvMeta && item.dvMeta.guia === guia && item.id !== edDvId;
    });
    if(duplicada){
      if(!confirm('⚠️ Atención: El número de guía ' + guia + ' ya fue registrado previamente en la venta de "' + (duplicada.dvMeta.nombre || 'otro cliente') + '". ¿Desea guardarlo de todos modos?')){
        return;
      }
    }
  }

  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var montoTotal = subtotal + envio;
  if(!(montoTotal > 0)){
    $('st').textContent = 'El monto total debe ser mayor a 0';
    return;
  }

  var id = edDvId || ('dv-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  
  var prevDv = edDvId ? S.items.filter(function(i){ return i.id === edDvId; })[0] : null;
  var ventaObj = {
    id: id,
    t: 'v',
    d: fecha,
    n: 'Venta: ' + nombre + (guia ? ' (Guía: ' + guia + ')' : ''),
    a: Math.round(montoTotal * 100) / 100,
    dvMeta: {
      nombre: nombre,
      tel: tel,
      provincia: provincia,
      canton: canton,
      distrito: distrito,
      otrosDatos: otrosDatos,
      articulos: dvArticulosTemp,
      envio: Math.round(envio * 100) / 100,
      guia: guia,
      guiaEnviada: (prevDv && prevDv.dvMeta && prevDv.dvMeta.guia === guia) ? (prevDv.dvMeta.guiaEnviada || '') : ''
    }
  };

  if(DB){
    DB.doc(P + 'items/' + id).set(ventaObj).then(function(){
      edDvId = null;
      dvArticulosTemp = [];
      $('st').textContent = 'Venta detallada guardada correctamente en la base de datos';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al guardar venta: ' + e.message;
    });
  }
}

function editDetalleVenta(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  edDvId = id;
  
  setTimeout(function(){
    if($('dv_fecha')) $('dv_fecha').value = item.d;
    if($('dv_guia')) $('dv_guia').value = item.dvMeta.guia || '';
    if($('dv_nombre')) $('dv_nombre').value = item.dvMeta.nombre || '';
    if($('dv_tel')) $('dv_tel').value = item.dvMeta.tel || '';
    if($('dv_envio')) $('dv_envio').value = item.dvMeta.envio || '';
    if($('dv_provincia')) $('dv_provincia').value = item.dvMeta.provincia || '';
    if($('dv_canton')) $('dv_canton').value = item.dvMeta.canton || '';
    if($('dv_distrito')) $('dv_distrito').value = item.dvMeta.distrito || '';
    if($('dv_otros')) $('dv_otros').value = item.dvMeta.otrosDatos || '';
  }, 50);

  dvArticulosTemp = JSON.parse(JSON.stringify(item.dvMeta.articulos || []));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelEditDetalleVenta(){
  edDvId = null;
  dvArticulosTemp = [];
  render();
}

function eliminarDetalleVenta(id){
  if(!confirm('¿Seguro que deseas eliminar esta venta detallada?')) return;
  if(DB){
    DB.doc(P + 'items/' + id).delete().then(function(){
      $('st').textContent = 'Venta eliminada';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al eliminar: ' + e.message;
    });
  }
}

function ingresarGuiaRapida(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  
  var actualGuia = item.dvMeta.guia || '';
  var nuevaGuia = prompt('Escanee con la pistola de código de barras o digite el número de guía:', actualGuia);
  
  if(nuevaGuia === null) return;
  
  nuevaGuia = nuevaGuia.trim();

  if(nuevaGuia){
    var duplicada = S.items.find(function(it){
      return it.id !== id && it.t === 'v' && it.dvMeta && it.dvMeta.guia === nuevaGuia;
    });
    if(duplicada){
      alert('⚠️ Alerta: El número de guía ' + nuevaGuia + ' ya fue asignado a otra venta (' + (duplicada.dvMeta.nombre || '') + ').');
    }
  }

  if(nuevaGuia !== actualGuia) item.dvMeta.guiaEnviada = '';
  item.dvMeta.guia = nuevaGuia;
  var cliente = item.dvMeta.nombre;
  item.n = 'Venta: ' + cliente + (nuevaGuia ? ' (Guía: ' + nuevaGuia + ')' : '');

  if(DB){
    DB.doc(P + 'items/' + id).set(item, {merge:true}).then(function(){
      $('st').textContent = 'Número de guía actualizado correctamente';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al actualizar guía: ' + e.message;
    });
  }
}

function marcarGuiaEnviada(id){
  var it=S.items.filter(function(i){return i.id===id})[0];
  if(!it||!it.dvMeta)return;
  it.dvMeta.guiaEnviada=today();
  if(DB)DB.doc(P+'items/'+id).set({dvMeta:{guiaEnviada:today()}},{merge:true}).catch(function(e){$('st').textContent='No se pudo marcar la guía como enviada: '+e.message});
  var c=$('dv_list_container');if(c)c.innerHTML=renderDetallesVentasList();
  refreshLote();
}
function toggleDvPend(el){
  DV_Pend=el.checked;DV_Limit=20;
  var c=$('dv_list_container');if(c)c.innerHTML=renderDetallesVentasList();
}
function enviarGuiaWhatsApp(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  var v = item.dvMeta;

  if(!v.guia) return;
  if(v.guiaEnviada && !confirm('Ya se le avisó a ' + v.nombre + ' el ' + shDot(v.guiaEnviada) + '. ¿Enviar el aviso de nuevo?')) return;
  marcarGuiaEnviada(id);

  var txt = '¡Hola ' + v.nombre + '! 👋 Le escribimos de *Little Nani* para informarle que su pedido ya tiene un número de guía asignado.\n\n'
          + '📦 *Número de guía:* ' + v.guia + '\n'
          + '🔍 *Enlace de rastreo:* https://correos.go.cr/rastreo/\n\n'
          + 'Ante cualquier consulta estamos a las órdenes. ¡Bonito día! ✨';

  if(v.tel){
    var cleanTel = v.tel.replace(/\D/g,'');
    if(cleanTel.length===8) cleanTel='506'+cleanTel;
    window.open('https://api.whatsapp.com/send?phone=' + cleanTel + '&text=' + encodeURIComponent(txt), '_blank');
  } else {
    navigator.clipboard.writeText(txt).then(function(){
      alert('Mensaje copiado al portapapeles (el cliente no tiene número de teléfono registrado).');
    }).catch(function(err){ alert('No se pudo copiar al portapapeles.'); });
  }
}

function imprimirEtiquetaEnvio(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  var v = item.dvMeta;
  
  var labelArea = $('print-label-area');
  if(!labelArea){
    labelArea = document.createElement('div');
    labelArea.id = 'print-label-area';
    document.body.appendChild(labelArea);
  }
  
  labelArea.innerHTML = etiquetaHTML(v);
    
  window.print();
}

function sinGuiaDelDia(){
  var dia=DV_Q||today();
  return {dia:dia,l:S.items.filter(function(i){return i.t==='v'&&i.dvMeta&&i.d===dia&&!String(i.dvMeta.guia||'').trim()})};
}
function loteBtn(){
  var r=sinGuiaDelDia(),b;
  var pc=S.items.filter(function(i){return i.t==='v'&&i.dvMeta&&String(i.dvMeta.guia||'').trim()&&!i.dvMeta.guiaEnviada}).length;
  if(!r.l.length)b='<p class="mu" style="margin:6px 0">Sin ventas pendientes de guía el '+shDot(r.dia)+'.</p>';
  else b='<button type="button" class="pri" style="background:var(--ac);margin:6px 0" onclick="imprimirEtiquetasLote()">🖨️ Imprimir etiquetas sin guía ('+r.l.length+') · '+shDot(r.dia)+'</button>';
  return b+'<label class="chk"><input type="checkbox" '+(DV_Pend?'checked':'')+' onchange="toggleDvPend(this)"> Solo guías por avisar al cliente ('+pc+')</label>';
}
function refreshLote(){var c=$('dv_lote');if(c)c.innerHTML=loteBtn()}
function imprimirEtiquetasLote(){
  var r=sinGuiaDelDia();
  if(!r.l.length){$('st').textContent='No hay ventas sin guía el '+shDot(r.dia);return}
  if(!confirm('Se imprimirán '+r.l.length+' etiqueta(s) de las ventas del '+shDot(r.dia)+' que aún no tienen guía. ¿Continuar?'))return;
  var la=$('print-label-area');
  if(!la){la=document.createElement('div');la.id='print-label-area';document.body.appendChild(la)}
  la.innerHTML=r.l.sort(function(a,b){return a.id<b.id?-1:1}).map(function(i){return etiquetaHTML(i.dvMeta)}).join('');
  window.print();
}
function filterDetalleVentas(el){
  DV_Q = el.value;
  DV_Today = false;
  refreshLote();
  var chk = $('dv_today_chk');
  if(chk) chk.checked = false;
  DV_Limit = 20;
  var container = $('dv_list_container');
  if(container) container.innerHTML = renderDetallesVentasList();
}

function filterDetalleVentasTexto(el){
  DV_SEARCH_Q = el.value.trim().toLowerCase();
  DV_Limit = 20;
  var container = $('dv_list_container');
  if(container) container.innerHTML = renderDetallesVentasList();
}

function toggleDetalleVentasToday(el){
  DV_Today = el.checked;
  if(DV_Today){
    DV_Q = today();
    var inp = $('dv_filter_date');
    if(inp) inp.value = DV_Q;
  } else {
    DV_Q = '';
    var inp = $('dv_filter_date');
    if(inp) inp.value = '';
  }
  DV_Limit = 20;
  var container = $('dv_list_container');
  if(container) container.innerHTML = renderDetallesVentasList();
  refreshLote();
}

function cargarMasVentas(){
  DV_Limit += 20;
  var container = $('dv_list_container');
  if(container) container.innerHTML = renderDetallesVentasList();
}

function deshacerAbono(id){
  var it=S.items.filter(function(x){return x.id===id})[0];
  if(!it||!it.ap||BUSY[id]) return;
  if(!confirm('¿Deshacer el abono de ₡'+money(it.a)+' de '+abonoNombre(it)+'? Se quitará de las ventas y se devolverá al saldo del apartado.')) return;
  var cr=S.creditos.filter(function(c){return c.id===it.ap})[0];
  var b=FS.batch();
  b.delete(FS.doc(P+'items/'+id));
  if(cr) b.update(FS.doc(P+'creditos/'+cr.id),{pagado:firebase.firestore.FieldValue.increment(-Math.min(it.a,cr.pagado||0))});
  BUSY[id]=true;
  setTimeout(function(){BUSY[id]=false},8000);
  b.commit().then(function(){
    BUSY[id]=false;
    $('st').textContent='Abono deshecho'+(cr?'; el monto volvió al saldo del apartado':' (el apartado ya no existe)');
    render();
  }).catch(function(e){BUSY[id]=false;$('st').textContent='Error al deshacer el abono: '+e.message});
}
function abonoNombre(i){return i.cl||String(i.n||'').split(' · ').slice(1).join(' · ')||String(i.n||'Abono')}
function renderDetallesVentasList(){
  var ventasDetalladas = S.items.filter(function(i){ 
    if(i.t !== 'v' || !(i.dvMeta || i.ap)) return false;
    if(DV_Pend && !(i.dvMeta && String(i.dvMeta.guia||'').trim() && !i.dvMeta.guiaEnviada)) return false;
    if(DV_Q && i.d !== DV_Q) return false;
    if(DV_SEARCH_Q){
      var v = i.dvMeta || {nombre: abonoNombre(i)};
      var matchNombre = (v.nombre || '').toLowerCase().indexOf(DV_SEARCH_Q) >= 0;
      var matchTel = (v.tel || '').toLowerCase().indexOf(DV_SEARCH_Q) >= 0;
      var matchGuia = (v.guia || '').toLowerCase().indexOf(DV_SEARCH_Q) >= 0;
      if(!matchNombre && !matchTel && !matchGuia) return false;
    }
    return true;
  });

  if(!ventasDetalladas.length){
    return '<div class="card"><p class="mu" style="margin:4px 0">No hay ventas detalladas registradas con los filtros actuales.</p></div>';
  }

  var sorted = ventasDetalladas.sort(function(a,b){return a.d < b.d ? 1 : -1});
  var paginated = sorted.slice(0, DV_Limit);

  var html = paginated.map(function(item){
    if(!item.dvMeta){
      var mn = String(item.n||'').match(/#(\S+)/);
      return '<div class="card"><b>'+esc(abonoNombre(item))+'</b> <span class="bd ok">₡'+money(item.a)+'</span>'
        +'<small class="mu">Fecha: '+shDot(item.d)+' · Abono de apartado'+(mn?' #'+esc(mn[1]):'')+'</small>'
        +'<div style="margin-top:8px"><button style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:4px 8px;font-size:12px" onclick="deshacerAbono(\''+item.id+'\')">Deshacer abono</button></div></div>';
    }
    var v = item.dvMeta;
    var artsStr = (v.articulos || []).map(function(a){ return a.desc + ' (₡' + money(a.precio) + ')'; }).join(', ');
    var tieneGuia = v.guia && v.guia.trim() !== '';
    
    return '<div class="card">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div>'
      + '<b>'+esc(v.nombre)+'</b> <span class="bd ok">₡'+money(item.a)+'</span>'
      + '<small class="mu">Fecha: '+shDot(item.d)+(v.tel ? ' · Tel: '+esc(v.tel) : '')+(tieneGuia ? ' · Guía: <b>'+esc(v.guia)+'</b>'+(v.guiaEnviada?' <span class="bd ok">✓ Enviada '+shDot(v.guiaEnviada)+'</span>':' <span class="bd">Falta avisar</span>') : ' · <span style="color:var(--bad)">Sin guía</span>')+'</small>'
      + '<small><b>Artículos:</b> '+esc(artsStr)+'</small>'
      + '<small class="mu"><b>Envío:</b> ₡'+money(v.envio)+' · <b>Dirección:</b> '+esc([v.provincia, v.canton, v.distrito, v.otrosDatos].filter(Boolean).join(', '))+'</small>'
      + '</div><div style="display:flex;gap:4px">'
      + '<button style="border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 8px;font-size:12px" onclick="editDetalleVenta(\''+item.id+'\')">Editar</button>'
      + '<button style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:4px 8px;font-size:12px" onclick="eliminarDetalleVenta(\''+item.id+'\')">Eliminar</button>'
      + '</div></div>'
      + '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'
      + '<button class="pri" style="background:var(--ac);width:auto;padding:8px 14px" onclick="imprimirEtiquetaEnvio(\''+item.id+'\')">🖨️ Imprimir Etiqueta</button>'
      + '<button class="pri" style="background:var(--ac);width:auto;padding:8px 14px" onclick="ingresarGuiaRapida(\''+item.id+'\')">🏷️ Introducir número de guía</button>'
      + '<button class="pri" style="background:'+(tieneGuia ? 'var(--ok)' : 'var(--mu)')+';color:#fff;width:auto;padding:8px 14px;'+(tieneGuia ? '' : 'opacity:0.6;cursor:not-allowed;')+'" '+(tieneGuia ? 'onclick="enviarGuiaWhatsApp(\''+item.id+'\')"' : 'disabled title="Debe ingresar el número de guía primero"')+'>'+(v.guiaEnviada?'🔁 Reenviar guía':'📤 Enviar Guía por WhatsApp')+'</button>'
      + '<button class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);width:auto;padding:8px 14px" onclick="imprimirComprobanteVenta(\''+item.id+'\')">🖨️ Imprimir comprobante</button>'
      + '</div>'
      + '</div>';
  }).join('');

  if(sorted.length > DV_Limit){
    html += '<button type="button" class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);margin-top:8px" onclick="cargarMasVentas()">Cargar más ventas (' + (sorted.length - DV_Limit) + ' restantes)</button>';
  }

  return html;
}

function summary(wi){
  var s=sum(wi),g=sum(S.items);
  
  var totalApartadosPendientes = 0;
  S.creditos.forEach(function(c){
    totalApartadosPendientes += (c.monto - c.pagado);
  });

  var fx=function(a){var e=0,n=0;a.forEach(function(i){if(i.t==='f'){if(i.e)e+=i.a;else n+=i.a}});return 'Facturas electrónicas '+money(e)+' · No electrónicas '+money(n)};
  
  var cards=function(r,x){
    x=x||0;
    var balanceReal = r.b + x;
    return '<div class="grid">'
      + '<div class="k"><span>Ventas</span><b>'+money(r.v)+'</b></div>'
      + '<div class="k"><span>Facturas</span><b>'+money(r.f)+'</b></div>'
      + '<div class="k"><span>Gastos</span><b>'+money(r.g)+'</b></div>'
      + '<div class="k bal"><span>Balance</span><b class="'+cls(balanceReal)+'">'+money(balanceReal)+'</b></div>'
      + '</div>';
  };

  var globalCards=function(r,x){
    x=x||0;
    var balanceReal = r.b + x;
    var balanceProyectado = balanceReal + totalApartadosPendientes;
    return '<div class="grid">'
      + '<div class="k"><span>Ventas</span><b>'+money(r.v)+'</b></div>'
      + '<div class="k"><span>Facturas</span><b>'+money(r.f)+'</b></div>'
      + '<div class="k"><span>Gastos</span><b>'+money(r.g)+'</b></div>'
      + '<div class="k"><span>Total por Cobrar (Pendiente)</span><b class="neg">'+money(totalApartadosPendientes)+'</b></div>'
      + '<div class="k bal"><span>Balance global</span><b class="'+cls(balanceReal)+'">'+money(balanceReal)+'</b></div>'
      + '<div class="k bal"><span>Balance global proyectado (Tomando en cuenta apartados)</span><b class="'+cls(balanceProyectado)+'">'+money(balanceProyectado)+'</b></div>'
      + '</div>';
  };

  var h=dashboardCard()+'<h2>Balance de la semana</h2>'+cards(s)+'<p class="mu">'+fx(wi)+'</p>'+period(cards,fx);
  
  var ws={};S.items.filter(function(i){return i&&i.d}).forEach(function(i){var w=wk(i.d);(ws[w]=ws[w]||[]).push(i)});
  var keys=Object.keys(ws).sort().reverse();
  h+=chart(ws,keys)+'<h2>Semana por semana</h2>';
  if(!keys.length)return h+'<p class="mu">Aún no hay movimientos. Empieza en Det. Ventas, Facturas o Gastos.</p><h2>Balance global</h2>'+globalCards(g,S.saldo||0)+saldoBox();
  h+='<div class="card sc"><table><thead><tr><th>Semana</th><th>Ventas</th><th>Fact.</th><th>Gastos</th><th>Balance</th></tr></thead><tbody>';
  keys.forEach(function(w){var r=sum(ws[w]);h+='<tr><td>'+wl(w)+'</td><td>'+money(r.v)+'</td><td>'+money(r.f)+'</td><td>'+money(r.g)+'</td><td class="'+cls(r.b)+'">'+money(r.b)+'</td></tr>'});
  h+='</tbody></table></div><h2>Mes por mes</h2><div class="card sc"><table><thead><tr><th>Mes</th><th>Ventas</th><th>Fact.</th><th>Gastos</th><th>Balance</th></tr></thead><tbody>';var MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],ms={};S.items.filter(function(i){return i&&i.d}).forEach(function(i){var m=i.d.slice(0,7);(ms[m]=ms[m]||[]).push(i)});Object.keys(ms).sort().reverse().forEach(function(m){var r=sum(ms[m]);h+='<tr><td>'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+'</td><td>'+money(r.v)+'</td><td>'+money(r.f)+'</td><td>'+money(r.g)+'</td><td class="'+cls(r.b)+'">'+money(r.b)+'</td></tr>'});h+='</tbody></table></div><h2>Balance global</h2>'+globalCards(g,S.saldo||0)+saldoBox()+'<p class="mu">'+fx(S.items)+'</p>'+cat()+'<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="pri" style="flex:1" onclick="exp()">Exportar a CSV</button><button type="button" class="pri" style="flex:1;background:var(--ac)" onclick="expJSON()">📥 Descargar Backup JSON</button></div>'
    +(RO?'':'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><label class="pri" style="flex:1;display:block;text-align:center;background:none;color:var(--tx);border:1px solid var(--bd);cursor:pointer">Importar CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="imp(this)"></label><label class="pri" style="flex:1;display:block;text-align:center;background:none;color:var(--tx);border:1px solid var(--bd);cursor:pointer">📥 Restaurar Backup JSON<input type="file" accept=".json,application/json" style="display:none" onchange="impJSON(this)"></label></div>');
  return h;
}
/* ===== Comprobante de venta para el cliente ===== */
function ventaPorId(id){return S.items.filter(function(i){return i.id===id})[0]}
function cvRef(item){return String(item.id||'').slice(-5).toUpperCase()}
function cvTotales(item){
  var v=item.dvMeta||{},arts=v.articulos||[];
  var sub=arts.reduce(function(x,a){return x+(a.precio||0)},0);
  return {arts:arts,sub:Math.round(sub*100)/100,env:v.envio||0,total:item.a};
}

function imprimirComprobanteVenta(id){
  var item=ventaPorId(id);if(!item||!item.dvMeta)return;
  var la=$('print-label-area');
  if(!la){la=document.createElement('div');la.id='print-label-area';document.body.appendChild(la)}
  la.innerHTML=comprobanteVentaHTML(item);
  window.print();
}

/* ===== Dashboard de inicio ===== */
function dashboardCard(){
  var t=today(),w=wk(t),m=t.slice(0,7),vh=0,vs=0,vm=0;
  S.items.forEach(function(i){if(i.t!=='v')return;if(i.d===t)vh+=i.a;if(wk(i.d)===w)vs+=i.a;if(i.d.slice(0,7)===m)vm+=i.a});
  var pc=0,np=0;
  S.creditos.forEach(function(c){var p=(c.monto||0)-(c.pagado||0);if(p>0){pc+=p;np++}});
  var ca=(S.cotizaciones||[]).filter(function(c){return c.estado!=='convertida'}).length;
  var lb='';try{lb=localStorage.getItem('cn_lastbackup')||''}catch(e){}
  var dias=lb?Math.round((new Date(t+'T00:00')-new Date(lb+'T00:00'))/864e5):null;
  var vieja=dias===null||dias>7;

  var envio=Math.round((parseFloat(String($('ct_envio').value).replace(',','.'))||0)*100)/100;
  var prev=edCtId?(S.cotizaciones||[]).filter(function(c){return c.id===edCtId})[0]:null;

    estado:prev?prev.estado:'pendiente'};

/* ===== Reporte mensual para el contador ===== */
var RC_Mes='';
var RC_MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
function rcMes(){return /^\d{4}-\d\d$/.test(RC_Mes)?RC_Mes:today().slice(0,7)}
function rcMesTxt(m){return RC_MN[+m.slice(5)-1]+' '+m.slice(0,4)}
function r2(n){return Math.round((n||0)*100)/100}
function rcDatos(m){
  var it=S.items.filter(function(i){return i&&i.d&&i.d.slice(0,7)===m}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var v=it.filter(function(i){return i.t==='v'}),f=it.filter(function(i){return i.t==='f'}),g=it.filter(function(i){return i.t==='g'});
  var tot=function(a){return r2(a.reduce(function(x,i){return x+i.a},0))};
  var fe=tot(f.filter(function(i){return i.e}));
  var cats={};g.forEach(function(i){var c=i.c||'Sin categoría';cats[c]=(cats[c]||0)+i.a});
  var provs={};f.forEach(function(i){var p=(i.n||'').trim()||'Sin proveedor',o=provs[p]||(provs[p]={ced:'',e:0,n:0});if(!o.ced&&i.j)o.ced=i.j;if(i.e)o.e+=i.a;else o.n+=i.a});
  var dias={};v.forEach(function(i){var o=dias[i.d]||(dias[i.d]={n:0,t:0});o.n++;o.t+=i.a});
  var ah=tot(g.filter(function(i){return /^Ahorro/.test(i.c||'')}));
  var tv=tot(v),tf=tot(f),tg=tot(g);
  return {m:m,v:v,f:f,g:g,tv:tv,tf:tf,tg:tg,fe:fe,fn:r2(tf-fe),cats:cats,provs:provs,dias:dias,ah:ah,bal:r2(tv-tf-tg)};
}
function rcT(cols,rows,foot){
  var b='border-bottom:1px solid #ccc;padding:5px 4px;white-space:normal;',h='';
  h+='<table style="width:100%;min-width:0;border-collapse:collapse;margin:6px 0 16px;font-size:12.5px"><thead><tr>';
  cols.forEach(function(c){h+='<th style="text-align:'+(c[1]?'right':'left')+';border-bottom:2px solid #000;padding:5px 4px;color:#000;white-space:normal">'+c[0]+'</th>'});
  h+='</tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="'+cols.length+'" style="'+b+'text-align:left">Sin registros</td></tr>';
  rows.forEach(function(r){h+='<tr style="page-break-inside:avoid">'+r.map(function(c,i){return '<td style="'+b+'text-align:'+(cols[i][1]?'right':'left')+'">'+c+'</td>'}).join('')+'</tr>'});
  if(foot&&rows.length)h+='<tr>'+foot.map(function(c,i){return '<td style="padding:5px 4px;font-weight:bold;border-top:2px solid #000;white-space:normal;text-align:'+(cols[i][1]?'right':'left')+'">'+c+'</td>'}).join('')+'</tr>';
  return h+'</tbody></table>';
}
function rcHTML(m){

function rcFilas(m,d){

function rcCSV(m,d){

      XLSX.writeFile(wb,'reporte-contador-little-nani-'+m+'.xlsx');
      $('st').textContent='';
    }catch(e){$('st').textContent='Error al crear el Excel: '+e.message+'. Se descargó en CSV.';rcCSV(m,d)}
  });
}
function reporteContadorCard(){
  return '<div class="card"><b>📑 Reporte mensual para el contador</b>'
    +'<p class="mu" style="margin:4px 0 8px">Ventas, facturas (electrónicas y no electrónicas, por proveedor) y gastos por categoría del mes elegido.</p>'
    +'<label class="mu">Mes</label><input type="month" value="'+rcMes()+'" onchange="RC_Mes=this.value">'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="pri" style="flex:1" onclick="rcPDF()">🖨️ PDF / Imprimir</button><button type="button" class="pri" style="flex:1" onclick="rcExcel()">📊 Excel</button></div></div>';
}

var PH={v:'Nota (opcional)',f:'Proveedor (elige o escribe uno nuevo)',g:'Concepto del gasto'};
var TT={v:'Ventas diarias',f:'Facturas',g:'Gastos'};
function section(t,wi){
  var E=ed?S.items.filter(function(i){return i.id===ed})[0]:null;if(E&&E.t!==t)E=null;var dd=E?E.d:W===wk(today())?today():W;
  var list=wi.filter(function(i){return i.t===t&&!i.dvMeta}).sort(function(a,b){return a.d<b.d?1:-1});
  var tot=list.reduce(function(x,i){return x+i.a},0);
  var h='<div class="card"><div class="row"><input type="date" id="d" value="'+dd+'"><input type="number" id="a" inputmode="decimal" step="0.01" min="0" placeholder="Monto" value="'+(E?E.a:'')+'"><input id="n" placeholder="'+PH[t]+'" value="'+(E?esc(E.n):'')+'"'+(t==='f'?' list="pv" autocomplete="off"':'')+'></div>'+(t==='f'?'<datalist id="pv">'+PV().slice(1).map(function(p){return '<option value="'+esc(p[1])+'">'}).join('')+'</datalist>':'')+(t==='f'?'<input id="j" inputmode="numeric" maxlength="20" placeholder="Cédula jurídica (opcional)" value="'+(E&&E.j?esc(E.j):'')+'">':'')+(t==='g'?'<select id="c">'+CATS.map(function(c){return '<option'+(E&&E.c===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>':'')
    +(t==='f'?'<label class="chk"><input type="checkbox" id="e"'+(E&&E.e?' checked':'')+'> Factura electrónica</label>':'')
    +'<button type="button" class="pri" onclick="add(\''+t+'\')">'+(E?'Guardar cambios':'Agregar')+'</button>'+(E?'<button type="button" class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="ed=null;render()">Cancelar</button>':'')+'</div>';
  if(RO)h='<p class="mu">Solo lectura: tu acceso no permite registrar ni modificar movimientos.</p>';h+='<h2>'+TT[t]+' de la semana · '+money(tot)+'</h2><div class="card">';
  if(!list.length)h+='<p class="mu" style="margin:4px 0">Sin registros esta semana.</p>';
  list.forEach(function(i){
    h+='<div class="it"><div class="t"><b>'+money(i.a)+'</b>'
      +'<small>'+shDot(i.d)+(i.n?' · '+esc(i.n):'')+(t==='f'?' · '+(i.e?'Electrónica':'No electrónica'):'')+(t==='g'?' · '+esc(i.c):'')+(t==='f'&&i.j?' · Céd. '+esc(i.j):'')+'</small></div>'
      +'<button onclick="eds(\''+i.id+'\')">Editar</button><button onclick="del(\''+i.id+'\')">'+(pend===i.id?'¿Seguro?':'✕')+'</button></div>';
  });
  return h+'</div>';
}
function render(){
  needFr=false;
  var root=$('app');
  if(!C){root.className='';root.innerHTML=gateView();return}
  if(!ready){root.innerHTML='<p class="mu">Cargando…</p>';return}
  var wi=S.items.filter(function(i){return i&&i.d&&wk(i.d)===W});
  var tabsConfig=[['r','Resumen'],['dv','Det. Ventas'],['ct','Cotizaciones'],['f','Facturas'],['g','Gastos'],['ah','Ahorros'],['cr','Apartados'],['b','Reportes']];
  var h='<div class="hd"><img src="'+LOGO+'" alt="Logo de Little Nani"><div><h1>Little Nani</h1><span class="mu">Cuentas del negocio</span></div><button class="lo" onclick="out()">Salir</button></div><div class="tabs">'+tabsConfig.map(function(p){return '<button class="'+(tab===p[0]?'on':'')+'" onclick="go(\''+p[0]+'\')">'+p[1]+'</button>'}).join('')+'</div>';
  if(tab!=='b'&&tab!=='ah'&&tab!=='cr'&&tab!=='dv'&&tab!=='ct')h+='<div class="wk"><button onclick="mv(-1)" aria-label="Semana anterior">‹</button><div><b>'+wl(W)+'</b><span class="mu">'+(W===wk(today())?'Esta semana':'&nbsp;')+'</span></div><button onclick="mv(1)" aria-label="Semana siguiente">›</button></div>';
  h+=tab==='r'?summary(wi):tab==='b'?search():tab==='ah'?ahorrosSection():tab==='cr'?creditosSection():tab==='dv'?detallesVentasSection():tab==='ct'?cotizacionesSection():section(tab,wi);
  root.className=RO?'ro':'';root.innerHTML=h;
  if(tab==='dv'){ renderArticulosTempList(); }
  if(tab==='ct'){ ctRenderArt(); }
}
init();
</script></body></html>
