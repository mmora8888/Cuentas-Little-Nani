<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Nani · Cuentas</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d9;--ac:#2f6f5e;--ac2:#173b59;--ok:#1f7a4d;--bad:#b3392f;--wn:#a86a0f;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#20201e;--tx:#efeee9;--mu:#a09f97;--bd:#343430;--ac:#5fb59f;--ac2:#286d78;--ok:#58c28a;--bad:#ef7a6f;--wn:#e0a64a;--on:#10201b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#20201e;--tx:#efeee9;--mu:#a09f97;--bd:#343430;--ac:#5fb59f;--ac2:#286d78;--ok:#58c28a;--bad:#ef7a6f;--wn:#e0a64a;--on:#10201b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:740px;margin:0 auto;padding:14px 14px 48px;width:100%;overflow-x:hidden}
h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.01em}
h2{font-size:15px;margin:20px 0 9px;color:var(--tx);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mu{color:var(--mu);font-size:12.5px}

/* Header y Navegación */
.hd{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.hd img{width:76px;height:76px;border-radius:50%;flex:none;background:#fff;border:1px solid var(--bd);object-fit:contain;object-position:center;padding:0;box-shadow:none}
.lo{margin-left:auto;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}

.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;min-width:82px;cursor:pointer;transition:all .15s ease}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 3px 10px rgba(47,111,94,.22)}

/* Selector de semana */
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 8px}
.wk div{text-align:center;display:flex;flex-direction:column}
.wk b{font-size:14px}
.wk button{width:38px;height:36px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Sistema de diseño unificado */
.dash-hero{background:linear-gradient(135deg,#173b59,#286d78);color:#fff;border-radius:18px;padding:18px;margin:4px 0 14px;box-shadow:0 8px 22px rgba(20,55,75,.14);word-break:break-word}
.dash-hero.verde{background:linear-gradient(135deg,#1b4d3e,#2f6f5e)}
.dash-hero.ambar{background:linear-gradient(135deg,#5a3918,#8f5b22)}
.dash-hero.vino{background:linear-gradient(135deg,#592121,#8c3730)}
.dash-hero .eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;opacity:.8;font-weight:600}
.dash-hero .amount{font-size:29px;font-weight:800;line-height:1.18;margin:4px 0;letter-spacing:-.02em;word-break:break-word}
.dash-hero .sub{font-size:12px;opacity:.85;margin-top:4px}

.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 14px}
.dash-tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 13px;min-width:0;overflow:hidden}
.dash-tile .label{font-size:11px;color:var(--mu);display:block;margin-bottom:4px;font-weight:500}
.dash-tile strong{font-size:18px;display:block;overflow-wrap:anywhere;font-weight:750}
.dash-tile small{font-size:11px;color:var(--mu);display:block;margin-top:2px}
.dash-wide{grid-column:1/-1}
@media(min-width:560px){.dash-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.dash-tile.hero-small{grid-column:span 2}}

.dash-section{margin-top:18px}
.dash-panel,.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:14px;margin-bottom:10px;overflow:hidden}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 13px}
.k span{display:block;font-size:11.5px;color:var(--mu);margin-bottom:3px}
.k b{font-size:18px}

/* Gráficas y barras de progreso */
.dash-bars{display:flex;align-items:flex-end;gap:8px;height:136px;padding:8px 2px 0;border-bottom:1px solid var(--bd);overflow-x:auto}
.dash-bar-group{flex:1;min-width:24px;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}
.dash-bar{width:min(38%,20px);min-height:3px;border-radius:5px 5px 0 0;transition:height .3s ease}
.dash-bar.in{background:#279b79}.dash-bar.out{background:#e19a55}.dash-bar.single{width:min(55%,28px);background:var(--ac)}
.dash-bar-label{position:absolute;bottom:-20px;font-size:9.5px;color:var(--mu);white-space:nowrap}
.dash-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:25px}
.dash-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

.prog-wrap{margin:8px 0 4px}
.prog-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--mu);gap:6px}
.prog-track{height:9px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;overflow:hidden;display:flex}
.prog-fill{height:100%;background:var(--ok);transition:width .3s ease}
.prog-fill.warn{background:var(--wn)}
.prog-fill.bad{background:var(--bad)}
.prog-fill.ac{background:var(--ac)}

.hbar-row{margin-bottom:9px}
.hbar-row:last-child{margin-bottom:0}
.hbar-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;gap:6px}
.hbar-track{height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
.hbar-fill{height:100%;background:var(--ac);border-radius:99px}

/* Alertas y estados */
.dash-alert{border-left:4px solid var(--wn);background:var(--bg);padding:10px 12px;border-radius:10px;margin:7px 0;font-size:13px;word-break:break-word}
.dash-alert.good{border-left-color:var(--ok)}.dash-alert.bad{border-left-color:var(--bad)}
.dash-change{font-size:11px;margin-top:4px;font-weight:600}.dash-change.up{color:var(--ok)}.dash-change.down{color:var(--bad)}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* Formularios adaptables a móvil */
.fld-lbl{display:block;font-size:11.5px;color:var(--mu);font-weight:600;margin:0 0 4px}
input,select{width:100%;max-width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:14.5px;margin-bottom:9px;transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--ac)}

.row-fm{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:480px){.row-fm{grid-template-columns:1fr 1.2fr}}

.row{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr;gap:0 9px}}

.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:9px;cursor:pointer}
.chk input{width:auto;margin:0;accent-color:var(--ac);transform:scale(1.1)}

.pri{width:100%;padding:11px 14px;border:0;border-radius:11px;background:var(--ac);color:var(--on);font:inherit;font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pri.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pri.ok{background:var(--ok);color:#fff}
.pri.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn-sm{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.btn-sm.bad{color:var(--bad)}
.btn-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn-bar > *{flex:1;min-width:130px}

/* Listas y badges */
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0;padding-bottom:2px}
.it:first-child{padding-top:2px}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.it .t small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.it button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}

.bd{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--wn);color:var(--wn);margin-left:5px;background:rgba(168,106,15,.08);display:inline-block;white-space:nowrap}
.bd.ok{border-color:var(--ok);color:var(--ok);background:rgba(31,122,77,.08)}
.bd.bad{border-color:var(--bad);color:var(--bad);background:rgba(179,57,47,.08)}

/* Tablas */
.sc{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tfoot td{font-weight:700;border-bottom:0}

/* Impresión y modales */
.lb-page{width:6in;height:4in;padding:.1in;overflow:hidden;break-inside:avoid;page-break-inside:avoid;background:#fff}
.label-box{width:100%;height:100%;border:2px solid #000;padding:12px 20px;border-radius:6px;background:#fff;color:#000;font-family:Arial,sans-serif;box-sizing:border-box;position:relative;overflow:hidden}
.lbm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);padding:10px}
.lbm>div{background:var(--card);color:var(--tx);width:100%;max-width:740px;max-height:90vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lbm .ls{overflow-y:auto;flex:1;min-height:80px;margin:8px 0}
.lbm .it{cursor:pointer}
.lbm .it input{width:auto;margin:0;flex:none;transform:scale(1.25)}
.lbm .bt{display:flex;gap:8px;flex-wrap:wrap}
.lbm .bt button{flex:1;min-width:130px}
#print-label-area{display:none}
@page{margin:10mm}
@media print{html,body{margin:0;padding:0;background:#fff}.lb-page:not(:last-child){break-after:page;page-break-after:always}body>*:not(#print-label-area){display:none!important}#print-label-area{display:block!important}}
</style>

function impCreditos(el) {

  if (!fl) return;
  var rd = new FileReader();
  rd.onload = function() {
    var rows = csv(String(rd.result));
    var out = [];
    var idsUsados = {};
    
    rows.slice(1).forEach(function(r) {
      var num = (r[0] || '').trim();
      var fechaStr = (r[1] || '').trim();
      var fecha = today();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(fechaStr)) {
        var p = fechaStr.split('/');
        fecha = p[2] + '-' + p[1] + '-' + p[0];
      } else if (/^\d{4}-\d\d-\d\d$/.test(fechaStr)) {
        fecha = fechaStr;
      }
      
      var plazo = parseInt(r[2]) || 0;
      var nombre = (r[4] || '').trim();
      var tel = (r[5] || '').trim();
      var desc = (r[6] || '').trim();
      var monto = parseMonto(r[7]) || 0;
      var pagado = parseMonto(r[8]) || 0;
      if(pagado < 0) pagado = 0;
      if(pagado > monto) pagado = monto;

      if (!nombre || !(monto > 0)) return;

      var uniqueKey = (num ? num : '') + '|' + nombre.toLowerCase() + '|' + fecha;
      var id = 'cr-' + hs(uniqueKey), idBase = id, nId = 1;
      while(idsUsados[id]){ nId++; id = idBase + '-' + nId; }
      idsUsados[id] = true;
      
      out.push({
        id: id,
        num: num,
        nombre: nombre,
        tel: tel,
        desc: desc,
        plazo: plazo,
        monto: Math.round(monto * 100) / 100,
        pagado: Math.round(pagado * 100) / 100,
        fecha: fecha
      });
    });

    if (!out.length) {
      $('st').textContent = 'No se encontraron apartados válidos en el archivo';
      el.value = '';
      return;
    }

    if(!confirm('⚠️ Importar este archivo REEMPLAZARÁ todos los apartados actuales ('+S.creditos.length+') por los '+out.length+' del archivo. ¿Desea continuar?')){ el.value=''; return; }
    delLotes('creditos', S.creditos.map(function(c){ return c.id; })).then(function(){
      var done = 0;
      (function nx() {
        var ch = out.slice(done, done + 400);
        if (!ch.length) {
          $('st').textContent = 'Se importaron ' + out.length + ' apartados de forma limpia (sin duplicados)';
          el.value = '';
          render();
          return;
        }
        var b = FS.batch();
        ch.forEach(function(item) {
          b.set(FS.doc(P + 'creditos/' + item.id), item);
        });
        b.commit().then(function() {
          done += 400;
          nx();
        }).catch(function(e) {
          $('st').textContent = 'No se pudo importar los apartados: ' + e.message;
        });
      })();
    }).catch(function(e){
      $('st').textContent = 'Error al limpiar datos previos: ' + e.message;
    });
  };
  rd.readAsText(fl, 'text/plain');
}

function expReporteProveedoresCSV(){

  facturasFiltradas.forEach(function(f){
    var provName = (f.n || '').trim() || 'Sin proveedor';

    var item = provMap[prov];

  });

function casaMesKey(){return S.casaPeriodoActivo||today().slice(0,7)}
function casaMesEtiqueta(){return S.casaPeriodoActivo?(S.casaPeriodoNombre||'Nuevo periodo') : casaMesKey()}
function casaMesCerrado(){return S.casaMesCerrado===casaMesKey()}
function casaItemsMes(){var m=casaMesKey(),manual=!!S.casaPeriodoActivo;return S.items.filter(function(i){if(manual)return i.casaPeriodo===m;return (!i.casaPeriodo||i.casaPeriodo===m)&&i.d&&i.d.slice(0,7)===m})}
function casaApartarSemana(){
  if(casaMesCerrado()){alert('Este mes ya fue cerrado. Los nuevos apartados estarán disponibles el próximo mes.');return}
  var mInput = prompt('Monto para apartar esta semana:', '160000');
  if(mInput === null) return;
  var monto = parseFloat(mInput.replace(',','.'));
  if(!(monto > 0)){ alert('Monto inválido'); return; }
  var it = {id:'casa-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:'g',d:today(),n:'Apartado semanal Fondo de la Casa',c:'Fondo Casa',a:Math.round(monto*100)/100,casaPeriodo:casaMesKey()};
  put(it);$('st').textContent='Apartado semanal guardado correctamente';render();

function casaEsPago(i){return i.t==='g'&&i.c!=='Fondo Casa'&&(i.c==='Gastos Casa'||i.c==='Pago Casa'||(i.n||'').indexOf('Pago Casa:')===0)}
function casaTotales(){var ap=0,pg=0;casaItemsMes().forEach(function(i){if(i.t!=='g')return;if(i.c==='Fondo Casa')ap+=Number(i.a)||0;else if(casaEsPago(i))pg+=Number(i.a)||0});ap=r2(ap);pg=r2(pg);return{apartado:ap,pagado:pg,disponible:r2(ap-pg)}}
function casaRubroPagado(nombre){return casaItemsMes().some(function(i){return casaEsPago(i)&&(i.n||'')==='Pago Casa: '+nombre})}
function casaCerrarMes(){
  var m=casaMesKey();
  if(casaMesCerrado()){alert('Este mes ya está cerrado. Puedes reabrirlo si necesitas registrar movimientos.');return}
  if(!confirm('Antes de cerrar '+m+' se descargará un respaldo completo. ¿Continuar?'))return;
  expJSON().then(function(ok){
    if(!ok){alert('No se pudo generar el respaldo, así que el mes no se cerró. Intenta de nuevo.');return}

    S.casaMesCerrado=m;
    if(DB)DB.doc(P+'config/main').set({casaMesCerrado:m},{merge:true}).then(function(){$('st').textContent='Mes cerrado correctamente';render()}).catch(function(e){S.casaMesCerrado='';$('st').textContent='No se pudo cerrar el mes: '+e.message;render()});
    else{$('st').textContent='Mes cerrado';render()}
  });
}
function casaReabrirMes(){

function casaPagarRubro(nombreRubro, montoPorDefecto){
  if(casaMesCerrado()){alert('El mes está cerrado. Los pagos se habilitarán el próximo mes.');return;}
  if(casaRubroPagado(nombreRubro)){alert('Este rubro ya aparece como pagado este mes.');render();return;}
  if(BUSY['rubro_' + nombreRubro]) return;
  var el = $('rubro_monto_' + nombreRubro);
  if(!el) return;
  var monto = parseFloat(String(el.value).trim().replace(',','.'));
  if(!isFinite(monto) || !(monto > 0)){ alert('Monto inválido'); return; }
  var disponible = casaTotales().disponible;
  if(monto > disponible){
    if(!confirm('⚠️ El monto a pagar (₡' + money(monto) + ') supera el fondo disponible de la casa (₡' + money(disponible) + '). ¿Deseas registrarlo de todas formas?')) return;
  }
  var catDestino = (nombreRubro === 'Ahorro Niños') ? 'Ahorro Niños' : 'Gastos Casa';
  var it = {
    id: 'casapago-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    t: 'g', d: today(), n: 'Pago Casa: ' + nombreRubro, c: catDestino, a: Math.round(monto * 100) / 100, casaPeriodo:casaMesKey()
  };
  BUSY['rubro_' + nombreRubro] = true;
  setTimeout(function(){ BUSY['rubro_' + nombreRubro] = false; }, 3000);
  put(it);
  $('st').textContent = 'Pago de ' + nombreRubro + ' registrado correctamente';
  render();
}

function guardarCuentasBancarias(){
  if(RO){$('st').textContent='Tu acceso es de solo lectura';return}
  var nouveaux={},hayUSD=false,errorMonto='';
  CUENTAS_BANCOS.forEach(function(x){
    var el=$('cta_'+x.id),raw=el?String(el.value).trim():'';
    var v=raw===''?0:parseFloat(raw.replace(/,/g,'.'));
    if(!isFinite(v)||v<0){errorMonto='Revisa el monto de '+x.nombre+'. Debe ser cero o mayor.';return}
    nouveaux[x.id]=Math.round(v*100)/100;
    if(x.moneda==='USD'&&v>0)hayUSD=true;
  });
  if(errorMonto){alert(errorMonto);return}
  var elFx=$('cta_fx'),fx=parseFloat(String(elFx?elFx.value:'').trim().replace(/,/g,'.'));
  if(!isFinite(fx)||fx<0){alert('Escribe un tipo de cambio válido, cero o mayor.');return}
  if(hayUSD&&fx<=0){alert('Debes indicar el tipo de cambio USD → CRC porque hay saldos en dólares.');return}
  fx=Math.round(fx*10000)/10000;
  S.cuentas=nouveaux;S.tipoCambioUSD=fx;
  if(DB){
    DB.doc(P+'config/main').set({cuentasBancarias:nouveaux,tipoCambioUSD:fx},{merge:true}).then(function(){
      $('st').textContent='Cuentas bancarias y efectivo guardados correctamente';render();
    }).catch(function(e){$('st').textContent='No se pudieron guardar las cuentas: '+e.message});
  }else{$('st').textContent='Cuentas actualizadas';render()}
}

    +'</div></div><h2>3. Historial de apartados y pagos</h2><div class="dash-panel">';

/* ===== Apartados ===== */
function ventaAbono(c,monto,fecha){
  return {id:'ab-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:'v',d:fecha,
    n:'Abono apartado'+(c.num?' #'+c.num:'')+' · '+c.nombre,a:Math.round(monto*100)/100,ap:c.id,cl:c.nombre};
}
function saveCreditoItem(){
  if(BUSY.save) return;
  var num = $('cr_num').value.trim();
  var nombre = $('cr_nombre').value.trim();
  var tel = $('cr_tel').value.trim();
  var desc = $('cr_desc').value.trim();
  var plazo = parseInt($('cr_plazo').value) || 0;
  var monto = parseFloat(String($('cr_monto').value).replace(',','.'));
  var pagado = parseFloat(String($('cr_pagado').value).replace(',','.')) || 0;
  var fecha = $('cr_fecha').value || today();

  if(!nombre || !(monto > 0)){ $('st').textContent = 'Indica el nombre del cliente y un monto total válido'; return; }
  if(pagado > monto) pagado = monto;

  var uniqueKey = (num ? num : '') + '|' + nombre.toLowerCase() + '|' + fecha;
  var id = edCrId || ('cr-' + hs(uniqueKey));
  if(!edCrId && S.creditos.some(function(c){ return c.id === id; })) id = id + '-' + Date.now().toString(36);
  var prevCr = edCrId ? S.creditos.filter(function(c){ return c.id === edCrId; })[0] : null;
  if(prevCr){
    var regAb = S.items.filter(function(i){ return i.t === 'v' && i.ap === edCrId; }).reduce(function(x,i){ return x + (Number(i.a)||0); }, 0);
    if(pagado < regAb - 0.005){
      $('st').textContent = 'Lo pagado no puede ser menor a los abonos ya registrados como ventas (₡' + money(regAb) + '). Para quitar one usa «Deshacer abono» en Ventas.';
      return;
    }
  }
  var creditoObj = {
    id: id, num: num, nombre: nombre, tel: tel, desc: desc, plazo: plazo,
    monto: Math.round(monto * 100) / 100, pagado: Math.round(pagado * 100) / 100, fecha: fecha
  };

  if(DB){
    var esNuevo = !edCrId;
    var bs = FS.batch();
    bs.set(FS.doc(P + 'creditos/' + id), creditoObj);
    if(esNuevo && creditoObj.pagado > 0){
      var vi = ventaAbono(creditoObj, creditoObj.pagado, fecha);
      bs.set(FS.doc(P + 'items/' + vi.id), vi);
    }
    if(prevCr){
      var difPag = Math.round((creditoObj.pagado - (prevCr.pagado||0))*100)/100;
      if(difPag > 0){
        var vd = ventaAbono(creditoObj, difPag, today());
        bs.set(FS.doc(P + 'items/' + vd.id), vd);
      }
    }
    BUSY.save = true;
    setTimeout(function(){ BUSY.save = false; }, 8000);
    bs.commit().then(function(){
      BUSY.save = false;edCrId = null;$('st').textContent = 'Apartado guardado en la base de datos';render();
    }).catch(function(e){BUSY.save = false;$('st').textContent = 'Error al guardar: ' + e.message;});
  }
}
function editCredito(id){edCrId = id;render();window.scrollTo({top:0, behavior:'smooth'});}
function cancelEditCredito(){edCrId = null;render();}
function abonarCredito(id){
  if(BUSY[id]) return;
  var el = $('abono_' + id);
  if(!el) return;
  var abono = parseFloat(String(el.value).replace(',','.'));
  if(!(abono > 0)){ $('st').textContent = 'Escribe un monto de abono válido'; return; }
  var cr = S.creditos.find(function(c){ return c.id === id; });
  if(cr){
    var pendiente = Math.round((cr.monto - cr.pagado)*100)/100;
    if(abono > pendiente) abono = pendiente;
    abono = Math.round(abono*100)/100;
    if(!(abono > 0)){ $('st').textContent = 'Este apartado ya está pagado'; return; }
    if(DB && firebase.firestore && firebase.firestore.FieldValue){
      var vb = ventaAbono(cr, abono, today());
      var bb = FS.batch();
      bb.update(FS.doc(P + 'creditos/' + id), { pagado: firebase.firestore.FieldValue.increment(abono) });
      bb.set(FS.doc(P + 'items/' + vb.id), vb);
      BUSY[id] = true;
      setTimeout(function(){ BUSY[id] = false; }, 8000);
      $('st').textContent = 'Guardando abono…';
      bb.commit().then(function(){
        BUSY[id] = false;$('st').textContent = 'Abono registrado correctamente';render();
      }).catch(function(e){BUSY[id] = false;$('st').textContent = 'Error al registrar abono: ' + e.message;});
    }
  }
}
function eliminarCredito(id){
  if(!confirm('¿Seguro que deseas eliminar este apartado?')) return;
  var abs = S.items.filter(function(i){ return i.t === 'v' && i.ap === id; });
  var quitar = false;
  if(abs.length){
    var totAb = abs.reduce(function(x,i){ return x + (Number(i.a)||0); }, 0);
    quitar = confirm('Este apartado tiene ' + abs.length + ' abono(s) por ₡' + money(totAb) + ' registrados como ventas.\n\nAceptar = eliminarlos también de las ventas.\nCancelar = conservarlos como ventas sueltas.');
  }
  if(DB){
    var delP;
    if(quitar){
      var bd = FS.batch();
      bd.delete(FS.doc(P + 'creditos/' + id));
      abs.forEach(function(i){ bd.delete(FS.doc(P + 'items/' + i.id)); });
      delP = bd.commit();
    } else { delP = DB.doc(P + 'creditos/' + id).delete(); }
    delP.then(function(){$('st').textContent = 'Apartado eliminado';render();}).catch(function(e){$('st').textContent = 'Error al eliminar: ' + e.message;});
  }
}
function abonosDe(c){

  var sm=l.reduce(function(x,i){return x+i.a},0);
  return {l:l,sum:sm,prev:Math.max(0,Math.round((c.pagado-sm)*100)/100)};
}

function filterCreditos(el){

function cargarMasCreditos(){
  CR_Limit += 50;
  var container = $('creditos_list_container');
  if(container) container.innerHTML = renderCreditosList();
}

function renderCreditosList(){
  var sortedCreditos = S.creditos.slice().sort(function(a, b){
    // Primero el número de apartado, de mayor a menor.
    // Si alguno no tiene número o los números coinciden, usar fecha más reciente.
    var numA = parseInt(String(a.num || '').replace(/\D/g, ''), 10) || 0;
    var numB = parseInt(String(b.num || '').replace(/\D/g, ''), 10) || 0;
    if(numA !== numB) return numB - numA;
    var fa = a.fecha || '', fb = b.fecha || '';
    if(fa !== fb) return fa < fb ? 1 : -1;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });

  var filtered = sortedCreditos.filter(function(c){
    if(CR_Atr && !crAtr(c)) return false;
    if(!CR_Q) return true;
    return c.nombre.toLowerCase().indexOf(CR_Q) >= 0 || (c.tel || '').toLowerCase().indexOf(CR_Q) >= 0 || (c.num || '').toLowerCase().indexOf(CR_Q) >= 0;
  });

  if(!filtered.length){
    return '<div class="dash-panel"><p class="mu" style="margin:4px 0">'+(CR_Atr&&!CR_Q?'No hay apartados atrasados 🎉':'No se encontraron apartados con ese número, nombre o teléfono.')+'</p></div>';
  }

  var paginated = filtered.slice(0, CR_Limit);

  var html = paginated.map(function(c){
    var pendiente = Math.round((c.monto - c.pagado) * 100) / 100;
    var diasPlazo = parseInt(c.plazo) || 0;
    var fechaLimite = diasPlazo > 0 ? addDays(c.fecha, diasPlazo) : '';
    var isAtrasado = (diasPlazo > 0 && pendiente > 0 && fechaLimite < today());
    var pctPagado = c.monto > 0 ? Math.min(100, Math.round((c.pagado / c.monto) * 100)) : 100;
    
    var estado = pendiente <= 0 ? '<span class="bd ok">Pagado</span>' : (isAtrasado ? '<span class="bd bad">⚠️ Atrasado</span>' : '<span class="bd">Pendiente</span>');
    
    var cardHtml = '<div class="dash-panel">'
       + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div>'
       + (c.num ? '<div class="mu" style="font-weight:700;font-size:11px;letter-spacing:.05em">APARTADO #' + esc(c.num) + '</div>' : '')
       + '<b style="font-size:16px">'+esc(c.nombre)+'</b> '+estado
       + '<div class="mu" style="margin-top:2px">Inicio: '+shDot(c.fecha)+(diasPlazo ? ' · Plazo: ' + diasPlazo + 'd (Vence: ' + shDot(fechaLimite) + ')' : '')+(c.tel?' · Tel: '+esc(c.tel):'')+'</div>'
       + '<div style="font-size:13.5px;margin-top:4px">'+esc(c.desc||'Sin descripción')+'</div>'
       + '</div><div style="display:flex;gap:5px"><button class="btn-sm" onclick="editCredito(\''+c.id+'\')">Editar</button><button class="btn-sm bad" onclick="eliminarCredito(\''+c.id+'\')">✕</button></div></div>'
       + '<div class="prog-wrap" style="margin-top:10px"><div class="prog-head"><span>Avance de pago ('+pctPagado+'%)</span><span>Resta: <b class="'+(pendiente>0?'neg':'pos')+'">₡'+money(pendiente)+'</b></span></div>'
       + '<div class="prog-track"><div class="prog-fill '+(pendiente<=0?'':'ac')+'" style="width:'+pctPagado+'%"></div></div></div>'
       + '<div style="margin-top:6px;display:flex;justify-content:space-between;font-size:13px;color:var(--mu);gap:6px"><span>Total: <b style="color:var(--tx)">₡'+money(c.monto)+'</b></span><span>Abonado: <b class="pos">₡'+money(c.pagado)+'</b></span></div>';
    
    cardHtml += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">';
    if(pendiente > 0){
      cardHtml += '<input id="abono_'+c.id+'" type="number" inputmode="decimal" step="0.01" placeholder="Monto abono" style="margin:0;flex:1;min-width:120px">'
         + '<button class="pri" style="width:auto;padding:0 14px" onclick="abonarCredito(\''+c.id+'\')">Abonar</button>';
    }
    cardHtml += '<button class="pri ok" style="width:auto;padding:8px 12px" onclick="enviarReporteCliente(\''+c.id+'\')">📤 Reporte</button>';
    cardHtml += '<button class="pri sec" style="width:auto;padding:8px 12px" onclick="imprimirReciboApartado(\''+c.id+'\')">🧾 Recibo</button>';
    cardHtml += '</div></div>';
    return cardHtml;
  }).join('');

  if(filtered.length > CR_Limit){
    html += '<button type="button" class="pri sec" style="margin-top:8px" onclick="cargarMasCreditos()">Cargar más apartados (' + (filtered.length - CR_Limit) + ' restantes)</button>';
  }
  return html;
}

        + '<div class="dash-tile"><span class="label">Apartados activos</span><strong>'+S.creditos.filter(function(c){return (c.monto-c.pagado)>0}).length+'</strong><small>De '+S.creditos.length+' totales</small></div>'

var dvArticulosTemp = [];
function agregarArticuloTemp(desc, precio){
  dvArticulosTemp.push({desc: desc || '', precio: parseFloat(precio) || 0});
  renderArticulosTempList();
}
function quitarArticuloTemp(index){
  dvArticulosTemp.splice(index, 1);
  renderArticulosTempList();
}
function renderArticulosTempList(){
  var container = $('dv_articulos_container');
  if(!container) return;
  if(!dvArticulosTemp.length){
    container.innerHTML = '<p class="mu" style="margin:4px 0 8px">Aún no hay artículos agregados.</p>';
    actualizarTotalVentaCalculado();
    return;
  }
  var html = dvArticulosTemp.map(function(art, idx){
    return '<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap">'
      + '<input type="text" placeholder="Descripción del artículo" value="'+esc(art.desc)+'" oninput="dvArticulosTemp['+idx+'].desc=this.value" style="margin:0;flex:2;min-width:130px">'
      + '<input type="number" inputmode="decimal" step="0.01" placeholder="Precio" value="'+(art.precio || '')+'" oninput="dvArticulosTemp['+idx+'].precio=parseFloat(this.value)||0; actualizarTotalVentaCalculado();" style="margin:0;flex:1;min-width:90px">'
      + '<button type="button" class="btn-sm bad" style="padding:9px 12px" onclick="quitarArticuloTemp('+idx+')">✕</button>'
      + '</div>';
  }).join('');
  container.innerHTML = html;
  actualizarTotalVentaCalculado();
}
function actualizarTotalVentaCalculado(){
  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var envio = parseFloat($('dv_envio') ? $('dv_envio').value : 0) || 0;
  var total = subtotal + envio;
  if($('dv_total_preview')) $('dv_total_preview').textContent = '₡' + money(total);
}
function saveDetalleVentaItem(){
  var fecha = $('dv_fecha').value || today();
  var nombre = $('dv_nombre').value.trim();
  var tel = $('dv_tel').value.trim();
  var provincia = $('dv_provincia').value.trim();
  var canton = $('dv_canton').value.trim();
  var distrito = $('dv_distrito').value.trim();
  var otrosDatos = $('dv_otros').value.trim();
  var envio = parseFloat(String($('dv_envio').value).replace(',','.')) || 0;
  var guia = $('dv_guia').value.trim();

  if(!nombre){ $('st').textContent = 'Indica el nombre del cliente'; return; }
  if(!dvArticulosTemp.length){ $('st').textContent = 'Agrega al menos un artículo a la venta'; return; }
  var invalidArt = dvArticulosTemp.some(function(art){ return !art.desc.trim() || !(art.precio > 0); });
  if(invalidArt){ $('st').textContent = 'Todos los artículos deben tener descripción y un precio mayor a 0'; return; }

  if(guia){
    var duplicada = S.items.find(function(item){
      return item.t === 'v' && item.dvMeta && item.dvMeta.guia === guia && item.id !== edDvId;
    });
    if(duplicada){
      if(!confirm('⚠️ Atención: El número de guía ' + guia + ' ya fue registrado previamente en la venta de "' + (duplicada.dvMeta.nombre || 'otro cliente') + '". ¿Desea guardarlo de todos modos?')) return;
    }
  }

  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var montoTotal = subtotal + envio;
  if(!(montoTotal > 0)){ $('st').textContent = 'El monto total debe ser mayor a 0'; return; }

  var id = edDvId || ('dv-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  var prevDv = edDvId ? S.items.filter(function(i){ return i.id === edDvId; })[0] : null;
  var ventaObj = {
    id: id, t: 'v', d: fecha,
    n: 'Venta: ' + nombre + (guia ? ' (Guía: ' + guia + ')' : ''),
    a: Math.round(montoTotal * 100) / 100,
    dvMeta: {
      nombre: nombre, tel: tel, provincia: provincia, canton: canton, distrito: distrito, otrosDatos: otrosDatos,
      articulos: dvArticulosTemp, envio: Math.round(envio * 100) / 100, guia: guia,
      guiaEnviada: (prevDv && prevDv.dvMeta && prevDv.dvMeta.guia === guia) ? (prevDv.dvMeta.guiaEnviada || '') : ''
    }
  };

  if(DB){
    DB.doc(P + 'items/' + id).set(ventaObj).then(function(){
      edDvId = null;dvArticulosTemp = [];$('st').textContent = 'Venta detallada guardada correctamente';render();
    }).catch(function(e){$('st').textContent = 'Error al guardar venta: ' + e.message;});
  }
}
function editDetalleVenta(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  edDvId = id;
  setTimeout(function(){
    if($('dv_fecha')) $('dv_fecha').value = item.d;
    if($('dv_guia')) $('dv_guia').value = item.dvMeta.guia || '';
    if($('dv_nombre')) $('dv_nombre').value = item.dvMeta.nombre || '';
    if($('dv_tel')) $('dv_tel').value = item.dvMeta.tel || '';
    if($('dv_envio')) $('dv_envio').value = item.dvMeta.envio || '';
    if($('dv_provincia')) $('dv_provincia').value = item.dvMeta.provincia || '';
    if($('dv_canton')) $('dv_canton').value = item.dvMeta.canton || '';
    if($('dv_distrito')) $('dv_distrito').value = item.dvMeta.distrito || '';
    if($('dv_otros')) $('dv_otros').value = item.dvMeta.otrosDatos || '';

function eliminarDetalleVenta(id){
  if(!confirm('¿Seguro que deseas eliminar esta venta detallada?')) return;
  if(DB){
    DB.doc(P + 'items/' + id).delete().then(function(){$('st').textContent = 'Venta eliminada';render();}).catch(function(e){$('st').textContent = 'Error al eliminar: ' + e.message;});
  }
}
function ingresarGuiaRapida(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  var actualGuia = item.dvMeta.guia || '';
  var nuevaGuia = prompt('Escanee con la pistola de código de barras o digite el número de guía:', actualGuia);
  if(nuevaGuia === null) return;
  nuevaGuia = nuevaGuia.trim();
  if(nuevaGuia){
    var duplicada = S.items.find(function(it){
      return it.id !== id && it.t === 'v' && it.dvMeta && it.dvMeta.guia === nuevaGuia;
    });
    if(duplicada) alert('⚠️ Alerta: El número de guía ' + nuevaGuia + ' ya fue asignado a otra venta (' + (duplicada.dvMeta.nombre || '') + ').');
  }
  if(nuevaGuia !== actualGuia) item.dvMeta.guiaEnviada = '';
  item.dvMeta.guia = nuevaGuia;
  item.n = 'Venta: ' + item.dvMeta.nombre + (nuevaGuia ? ' (Guía: ' + nuevaGuia + ')' : '');
  if(DB){
    DB.doc(P + 'items/' + id).set(item, {merge:true}).then(function(){
      $('st').textContent = 'Número de guía actualizado correctamente';render();
    }).catch(function(e){$('st').textContent = 'Error al actualizar guía: ' + e.message;});
  }
}

  var it=S.items.filter(function(i){return i.id===id})[0];
  if(!it||!it.dvMeta)return;
  it.dvMeta.guiaEnviada=today();

function enviarGuiaWhatsApp(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  var v = item.dvMeta;

  var txt = '¡Hola ' + v.nombre + '! 👋 Le escribimos de *Little Nani* para informarle que su pedido ya tiene un número de guía asignado.\n\n'
          + '📦 *Número de guía:* ' + v.guia + '\n'
          + '🔍 *Enlace de rastreo:* https://correos.go.cr/rastreo/\n\n'
          + 'Ante cualquier consulta estamos a las órdenes. ¡Bonito día! ✨';
  if(v.tel){

    if(cleanTel.length===8) cleanTel='506'+cleanTel;

  } else {
    navigator.clipboard.writeText(txt).then(function(){
      alert('Mensaje copiado al portapapeles (el cliente no tiene número de teléfono registrado).');
    }).catch(function(){ alert('No se pudo copiar al portapapeles.'); });
  }

function loteBtn(){

function lbAbrir(){

    +'<div class="ls">';

  });
  h+='</div><div class="bt" style="margin-bottom:8px"><button type="button" class="pri sec" onclick="lbTodas(true)">Marcar todas</button><button type="button" class="pri sec" onclick="lbTodas(false)">Desmarcar todas</button></div>'

function lbCargarPDF(cb){
  if(window.jspdf){cb(true);return}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload=function(){cb(!!window.jspdf)};s.onerror=function(){cb(false)};
  document.head.appendChild(s);
}
function lbPDF(){
  var l=lbElegidas();
  if(!l.length){$('st').textContent='Marca al menos una etiqueta';return}
  $('st').textContent='Preparando PDF…';
  lbCargarPDF(function(ok){
    if(!ok){$('st').textContent='No se pudo cargar el generador de PDF (revisa tu conexión).';return}
    try{
      var J=window.jspdf.jsPDF,doc=new J({orientation:'landscape',unit:'in',format:[4,6]});
      var cl=function(x){return String(x==null?'':x).replace(/[^\u0020-\u00FF]/g, '')};
      l.forEach(function(it,idx){
        var v=it.dvMeta;if(idx)doc.addPage([4,6],'landscape');
        doc.setDrawColor(0);doc.setTextColor(0);
        doc.setLineWidth(0.03);doc.roundedRect(0.1,0.1,5.8,3.8,0.06,0.06);
        doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('Remitente',0.3,0.36);
        doc.setLineWidth(0.02);doc.rect(0.3,0.42,2.5,0.82);
        doc.setFontSize(7.5);doc.text('Envía: Little Nani',0.37,0.57);
        doc.setFont('helvetica','normal');
        ['Cartago, Alvarado, Cervantes','Calle Linda vista en Little Nani','Cédula 801290969','Tel: 8633-5721'].forEach(function(t,k){doc.text(t,0.37,0.7+k*0.13)});
        var ub=cl([v.provincia,v.canton,v.distrito].filter(Boolean).join(', '));
        var rows=[['Nombre:',cl(v.nombre)],['Teléfono:',cl(v.tel||'N/D')],['',ub],['Dirección:',cl(v.otrosDatos)]];
        var fs=13,lines,y0,lh;
        for(;fs>=8;fs--){
          doc.setFontSize(fs);lh=fs*1.35/72;lines=[];
          rows.forEach(function(r){
            doc.setFont('helvetica','bold');var lw=r[0]?doc.getTextWidth(r[0]+' '):0;
            doc.setFont('helvetica','normal');
            var parts=doc.splitTextToSize(r[1]||' ',5.4-lw);
            parts.forEach(function(p,k){lines.push({l:k?'':r[0],t:p,w:lw})});
          });
          y0=3.78-(0.32+lines.length*lh);
          if(y0>=1.4)break;
        }
        doc.setFont('helvetica','bold');doc.setFontSize(fs+2);doc.text('Destinatario:',3,y0+0.2,{align:'center'});
        doc.setFontSize(fs);var y=y0+0.32+lh*0.8;
        lines.forEach(function(r){
          if(r.l){doc.setFont('helvetica','bold');doc.text(r.l,0.3,y)}
          doc.setFont('helvetica','normal');doc.text(r.t,0.3+r.w,y);y+=lh;
        });
      });
      doc.save('etiquetas-little-nani-'+(DV_Q||today())+'.pdf');
      $('st').textContent='';
    }catch(e){$('st').textContent='Error al crear el PDF: '+e.message}
  });
}

function toggleDetalleVentasToday(el){

  else { DV_Q = ''; var inp = $('dv_filter_date'); if(inp) inp.value = ''; }

function deshacerAbono(id){
  var it=S.items.filter(function(x){return x.id===id})[0];
  if(!it||!it.ap||BUSY[id]) return;
  if(!confirm('¿Deshacer el abono de ₡'+money(it.a)+' de '+abonoNombre(it)+'? Se quitará de las ventas y se devolverá al saldo del apartado.')) return;
  var cr=S.creditos.filter(function(c){return c.id===it.ap})[0];
  var b=FS.batch();
  b.delete(FS.doc(P+'items/'+id));
  if(cr) b.update(FS.doc(P+'creditos/'+cr.id),{pagado:firebase.firestore.FieldValue.increment(-Math.min(it.a,cr.pagado||0))});
  BUSY[id]=true;setTimeout(function(){BUSY[id]=false},8000);
  b.commit().then(function(){
    BUSY[id]=false;$('st').textContent='Abono deshecho'+(cr?'; el monto volvió al saldo del apartado':' (el apartado ya no existe)');render();
  }).catch(function(e){BUSY[id]=false;$('st').textContent='Error al deshacer el abono: '+e.message});
}
function abonoNombre(i){return i.cl||String(i.n||'').split(' · ').slice(1).join(' · ')||String(i.n||'Abono')}

      var v = i.dvMeta || {nombre: abonoNombre(i)};

    var tieneGuia = v.guia && v.guia.trim() !== '';

function dvTotalDia(){
  var dia=DV_Q||today(),t=0,n=0;
  S.items.forEach(function(i){if(i.t==='v'&&(i.dvMeta||i.ap)&&i.d===dia){t+=Number(i.a)||0;n++}});
  return '<span class="label">'+(dia===today()?'Ventas detalladas de hoy':'Ventas del '+shDot(dia))+' ('+n+' pedidos)</span><strong class="pos">'+money(r2(t))+'</strong>';
}
function ventas7DiasChart(){
  var t=today(),days=[],mx=1;
  for(var j=6;j>=0;j--){
    var d=addDays(t,-j),v=0;
    S.items.forEach(function(i){if(i.t==='v'&&i.d===d)v+=Number(i.a)||0});
    if(v>mx)mx=v;
    days.push({d:d,v:v});
  }
  var bars=days.map(function(x){
    var h=Math.max(4,Math.round((x.v/mx)*100));
    return '<div class="dash-bar-group"><div class="dash-bar single" style="height:'+h+'%" title="'+shDot(x.d)+': ₡'+money(x.v)+'"></div><span class="dash-bar-label">'+x.d.slice(8)+'/'+x.d.slice(5,7)+'</span></div>';
  }).join('');
  return '<div class="dash-panel"><div style="font-size:12px;font-weight:600;color:var(--mu);margin-bottom:4px">Ritmo de ventas · últimos 7 días</div><div class="dash-bars" style="height:105px">'+bars+'</div><div style="height:18px"></div></div>';
}

function resumenMesData(desde,hasta){
  var r={v:0,f:0,g:0};
  S.items.forEach(function(i){if(!i||!i.d||i.d<desde||i.d>hasta)return;if(esFondo(i))return;if(r[i.t]!==undefined)r[i.t]+=Number(i.a)||0});
  r.b=r.v-r.f-r.g;return r;
}
function resumenFlujo(desde,hasta){
  var entradas=0,salidasGastos=0,salidasFacturas=0;
  S.items.forEach(function(i){if(!i||!i.d||i.d<desde||i.d>hasta||esFondo(i))return;
    if(i.t==='v')entradas+=Number(i.a)||0;
    if(i.t==='g')salidasGastos+=Number(i.a)||0;
  });
  S.items.forEach(function(i){if(i&&i.t==='f'&&i.d>=desde&&i.d<=hasta&&!cxGet(i.id))salidasFacturas+=Number(i.a)||0});
  (S.cxp||[]).forEach(function(c){
    var ab=c.abonos||[];
    ab.forEach(function(a){if(a.f>=desde&&a.f<=hasta)salidasFacturas+=Number(a.m)||0});
    if(c.liq&&c.d>=desde&&c.d<=hasta){var rest=r2((Number(c.a)||0)-cxPagado(c));if(rest>0)salidasFacturas+=rest}
  });
  return {entradas:entradas,salidas:salidasGastos+salidasFacturas,gastos:salidasGastos,facturas:salidasFacturas,neto:entradas-salidasGastos-salidasFacturas};
}
function resumenComparacionMes(){
  var now=new Date(),inicio=new Date(now.getFullYear(),now.getMonth(),1),ayer=now.getDate();
  var fin=new Date(now.getFullYear(),now.getMonth(),ayer),prevInicio=new Date(now.getFullYear(),now.getMonth()-1,1),prevFin=new Date(now.getFullYear(),now.getMonth()-1,Math.min(ayer,new Date(now.getFullYear(),now.getMonth(),0).getDate()));
  var a=resumenMesData(iso(inicio),iso(fin)),b=resumenMesData(iso(prevInicio),iso(prevFin));
  function delta(x,y){if(!y)return x?null:0;return (x-y)/Math.abs(y)*100}
  function cmp(label,x,y){var d=delta(x,y),txt=d===null?'Sin base de comparación':(d>=0?'+':'')+d.toFixed(1)+'% vs periodo anterior';return '<div class="dash-tile"><span class="label">'+label+'</span><strong>'+money(x)+'</strong><div class="dash-change '+(d===null?'':d>=0?'up':'down')+'">'+txt+'</div><small>Anterior: '+money(y)+'</small></div>'}
  return {html:cmp('Ventas del mes',a.v,b.v)+cmp('Gastos del mes',a.g+a.f,b.g+b.f),actual:a,anterior:b,desde:iso(inicio),hasta:iso(fin)};
}
function resumenGraficoFlujo(){
  var fin=today(),weeks={};
  for(var j=0;j<5;j++){weeks[addDays(wk(fin),-7*j)]=true}
  var ks=Object.keys(weeks).sort(),html='';
  ks.forEach(function(w){var hasta=addDays(w,6);if(hasta>fin)hasta=fin;var f=resumenFlujo(w,hasta),mx=Math.max(f.entradas,f.salidas,1),hi=Math.max(3,Math.round(f.entradas/mx*100)),ho=Math.max(3,Math.round(f.salidas/mx*100));html+='<div class="dash-bar-group"><div class="dash-bar in" style="height:'+hi+'%" title="Entradas '+money(f.entradas)+'"></div><div class="dash-bar out" style="height:'+ho+'%" title="Salidas '+money(f.salidas)+'"></div><span class="dash-bar-label">'+shDot(w).slice(0,5)+'</span></div>'});
  return '<div class="dash-panel"><div class="dash-bars">'+html+'</div><div class="dash-legend"><span><i style="background:#279b79"></i>Entradas registradas</span><span><i style="background:#e19a55"></i>Salidas pagadas/registradas</span></div><p class="mu">Últimas cinco semanas. Los pagos de facturas se toman por fecha de abono cuando existe historial.</p></div>';
}
function resumenAlertas(balanceReal){
  var out='',pendientes=cxPendList(),at=atrasados(),cu=cuentasTotalCRC(),dif=cu.total-balanceReal;
  if(pendientes.length)out+='<div class="dash-alert">🧾 <b>'+pendientes.length+' cuenta(s) por pagar pendientes</b><br>Saldo pendiente registrado: '+money(cxTot(pendientes).s)+'.</div>';
  if(at.length)out+='<div class="dash-alert">⏰ <b>'+at.length+' apartado(s) atrasado(s)</b><br>Hay clientes con saldo pendiente cuyo plazo ya venció.</div>';
  if(cu.completo&&Math.abs(dif)>0.01)out+='<div class="dash-alert '+(dif<0?'bad':'')+'">🏦 <b>Diferencia en conciliación: '+money(dif)+'</b><br>'+(dif>0?'El dinero contado supera el balance global real.':'El dinero contado es menor que el balance global real.')+'</div>';
  if(!cu.completo)out+='<div class="dash-alert">🏦 Completa el tipo de cambio USD → CRC en Gastos de la Casa para activar la comparación bancaria.</div>';
  if(!out)out='<div class="dash-alert good">✓ No se detectan cuentas por pagar pendientes ni apartados atrasados. La conciliación bancaria no presenta diferencias.</div>';
  return '<div class="dash-panel">'+out+'</div>';
}
var AJ_POS=['Sobrante','Otro'],AJ_NEG=['Faltante','Comisión bancaria o de pasarela','Otro'];
function ajTot(){var t=0;(S.ajustes||[]).forEach(function(a){if(a&&!a.anulado)t+=Number(a.m)||0});return r2(t)}
function balanceRealNow(){return r2(sum(S.items).b+(S.saldo||0)+cxTot(cxPendList()).s+ajTot())}
function ajusteBox(cu,balanceReal){
  var h='',dif=r2(cu.total-balanceReal);
  if(cu.completo&&Math.abs(dif)>0.01&&!RO){
    var ms=dif>0?AJ_POS:AJ_NEG;
    h+='<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(128,128,128,.3)"><b>Registrar ajuste de conciliación</b>'
      +'<div class="mu">Diferencia actual: ₡'+money(dif)+'. El ajuste se suma al balance global real para acercar la diferencia a cero y queda en el historial.</div>'
      +'<label class="fld-lbl">Motivo</label><select id="aj_mot">'+ms.map(function(m){return '<option>'+esc(m)+'</option>'}).join('')+'</select>'
      +'<label class="fld-lbl">Monto a ajustar</label><input id="aj_m" type="number" inputmode="decimal" step="0.01" min="0" value="'+Math.abs(dif)+'">'
      +'<label class="fld-lbl">Nota (opcional)</label><input id="aj_n" maxlength="200" placeholder="Ej.: comisión de Tilopay">'
      +'<button type="button" class="pri" onclick="ajGuardar()">Registrar ajuste</button></div>';
  }
  return h+ajHistorial();
}
function ajHistorial(){
  var l=(S.ajustes||[]).slice().sort(function(a,b){return a.f===b.f?(a.id<b.id?1:-1):(a.f<b.f?1:-1)});
  if(!l.length)return '';
  var h='<div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(128,128,128,.3)"><b>Historial de ajustes</b><div class="mu">Vigentes: ₡'+money(ajTot())+' (incluidos en el balance global real)</div>';
  l.slice(0,15).forEach(function(a){
    var neg=a.m<0;
    h+='<div class="it" style="justify-content:space-between;gap:8px;align-items:center'+(a.anulado?';opacity:.55':'')+'"><div><b>'+esc(a.mot||'Otro')+'</b> · '+shDot(a.f)+(a.anulado?' · <i>anulado</i>':'')+(a.nota?'<div class="mu">'+esc(a.nota)+'</div>':'')+'</div>'
      +'<div style="text-align:right"><span class="'+(neg?'neg':'pos')+'"'+(a.anulado?' style="text-decoration:line-through"':'')+'>'+(neg?'-':'+')+'₡'+money(Math.abs(a.m))+'</span>'
      +(!a.anulado&&!RO?'<div><button type="button" class="btn-sm bad" onclick="ajAnular(\''+a.id+'\')">Anular</button></div>':'')+'</div></div>';
  });
  if(l.length>15)h+='<div class="mu">Mostrando los 15 más recientes de '+l.length+'.</div>';
  return h+'</div>';
}
function ajGuardar(){
  if(!DB||RO||BUSY['aj'])return;
  var cu=cuentasTotalCRC();
  if(!cu.completo){$('st').textContent='Falta el tipo de cambio USD → CRC para conciliar';return}
  var dif=r2(cu.total-balanceRealNow());
  if(Math.abs(dif)<=0.01){$('st').textContent='No hay diferencia que ajustar';return}
  var ms=dif>0?AJ_POS:AJ_NEG,mot=($('aj_mot')||{}).value||'Otro';if(ms.indexOf(mot)<0)mot='Otro';
  var nota=((($('aj_n')||{}).value)||'').trim().slice(0,200);

function r2(n){return Math.round((Number(n)||0)*100)/100}
function cxGet(id){return (S.cxp||[]).filter(function(c){return c.id===id})[0]}
function cxPagado(c){return r2((c.abonos||[]).reduce(function(s,a){return s+(Number(a.m)||0)},0))}
function cxSaldo(c){return c.liq?0:Math.max(0,r2((Number(c.a)||0)-cxPagado(c)))}
function cxVenc(c){return cxSaldo(c)>0&&c.v&&c.v<today()}
function cxPronto(c){return cxSaldo(c)>0&&c.v&&c.v>=today()&&c.v<=addDays(today(),3)}
function cxTot(l){var t=0,p=0,s=0;l.forEach(function(c){t+=Number(c.a)||0;p+=cxPagado(c);s+=cxSaldo(c)});return {t:r2(t),p:r2(p),s:r2(s)}}

}

  var p=($('cx_p').value||'').trim(),d=$('cx_d').value||today(),v=$('cx_v').value||'';

function imSetR(k,v){if(!v)return;if(k)IM_H=v;else IM_D=v;if(IM_D>IM_H){if(k)IM_D=v;else IM_H=v}IM_Y=+IM_D.slice(0,4);IM_ExP={};IM_ExT={};IM_Open={};render()}
function imNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function imData(d,h,useEx){
  var fs=S.items.filter(function(i){return i&&i.t==='f'&&i.d&&i.d>=d&&i.d<=h}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var n2c={};
  S.items.forEach(function(i){if(i&&i.t==='f'&&i.j&&String(i.j).trim()){var k=imNorm(i.n);if(k&&!n2c[k])n2c[k]=String(i.j).trim()}});
  var map={},list=[];
  fs.forEach(function(i,ix){
    var nm=(i.n||'').trim()||'Sin proveedor',ced=(i.j&&String(i.j).trim())||n2c[imNorm(i.n)]||'';
    var key=ced?'c:'+imNorm(ced).replace(/ /g,''):'n:'+(imNorm(nm)||'sin proveedor');
    var p=map[key];
    if(!p){p=map[key]={key:key,j:ced,names:{},e:[],ne:[]};list.push(p)}
    p.names[nm]=(p.names[nm]||0)+1;
    (i.e?p.e:p.ne).push(ix);
  });

  list.forEach(function(p){
    var best='',bc=0;Object.keys(p.names).forEach(function(k){if(p.names[k]>bc){bc=p.names[k];best=k}});p.n=best;
    p.eInc=0;p.eAll=0;p.nInc=0;p.nAll=0;
    ['e','ne'].forEach(function(f){p[f].forEach(function(ix){
      var i=fs[ix],a=Number(i.a)||0,inc=!(i.ex270||(useEx&&(IM_ExP[p.key]||IM_ExT[i.id])));
      if(f==='e'){p.eAll+=a;if(inc){p.eInc+=a;T.nF++}}else{p.nAll+=a;if(inc){p.nInc+=a;T.nF++}}
      if(!inc)T.exc+=a;

    T.e+=p.eInc;T.ne+=p.nInc;
  });

  list.sort(function(a,b){return (b.eAll+b.nAll)-(a.eAll+a.nAll)});
  list.forEach(function(p,ix){p.idx=ix});
  return T;
}

  var n2c={};

  var months={},ml=[],pt={},pl=[],D={months:ml,provs:pl,total:0,exc:0,nInc:0,nExc:0};
  fs.forEach(function(i){
    var nm=(i.n||'').trim()||'Sin proveedor',ced=(i.j&&String(i.j).trim())||n2c[imNorm(i.n)]||'';
    var key=ced?'c:'+imNorm(ced).replace(/ /g,''):'n:'+(imNorm(nm)||'sin proveedor');
    var m=i.d.slice(0,7),M=months[m];
    if(!M){M=months[m]={m:m,map:{},provs:[],total:0,exc:0};ml.push(M)}
    var P=M.map[key];
    if(!P){P=M.map[key]={key:key,j:ced,names:{},items:[],inc:0,all:0,nInc:0};M.provs.push(P)}
    P.names[nm]=(P.names[nm]||0)+1;P.items.push(i);
    var a=Number(i.a)||0;P.all+=a;
    var T=pt[key];if(!T){T=pt[key]={key:key,j:ced,names:{},inc:0,nInc:0};pl.push(T)}
    T.names[nm]=(T.names[nm]||0)+1;
    if(i.ex270){M.exc+=a;D.exc+=a;D.nExc++}else{P.inc+=a;P.nInc++;M.total+=a;T.inc+=a;T.nInc++;D.total+=a;D.nInc++}
  });
  var best=function(o){var b='',c=0;Object.keys(o).forEach(function(k){if(o[k]>c){c=o[k];b=k}});return b};
  ml.forEach(function(M){M.provs.forEach(function(P){P.n=best(P.names);P.inc=r2(P.inc)});M.provs.sort(function(a,b){return b.all-a.all});M.total=r2(M.total);M.exc=r2(M.exc)});
  pl.forEach(function(T){T.n=best(T.names);T.inc=r2(T.inc)});
  pl.sort(function(a,b){return b.inc-a.inc});
  ml.sort(function(a,b){return a.m<b.m?-1:1});
  D.total=r2(D.total);D.exc=r2(D.exc);
  return D;
}
