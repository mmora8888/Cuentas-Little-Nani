      if(data.ahorros) configObj.ahorros = data.ahorros;
      if(Object.keys(configObj).length > 0){

function impCreditos(el) {
  var fl = el.files && el.files[0];
  if (!fl) return;
  var rd = new FileReader();
  rd.onload = function() {
    var rows = csv(String(rd.result));
    var out = [];
    
    rows.slice(1).forEach(function(r) {
      var num = (r[0] || '').trim();
      var fechaStr = (r[1] || '').trim();
      var fecha = today();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(fechaStr)) {
        var p = fechaStr.split('/');
        fecha = p[2] + '-' + p[1] + '-' + p[0];
      } else if (/^\d{4}-\d\d-\d\d$/.test(fechaStr)) {
        fecha = fechaStr;
      }
      
      var plazo = parseInt(r[2]) || 0;
      var nombre = (r[4] || '').trim();
      var tel = (r[5] || '').trim();
      var desc = (r[6] || '').trim();
      var monto = parseFloat(String(r[7] || '').replace(',', '.')) || 0;
      var pagado = parseFloat(String(r[8] || '').replace(',', '.')) || 0;

      if (!nombre || !(monto > 0)) return;

      var uniqueKey = (num ? num : '') + '|' + nombre.toLowerCase() + '|' + fecha;
      var id = 'cr-' + hs(uniqueKey);
      
      out.push({
        id: id,
        num: num,
        nombre: nombre,
        tel: tel,
        desc: desc,
        plazo: plazo,
        monto: Math.round(monto * 100) / 100,
        pagado: Math.round(pagado * 100) / 100,
        fecha: fecha
      });
    });

    if (!out.length) {
      $('st').textContent = 'No se encontraron apartados válidos en el archivo';
      el.value = '';
      return;
    }

    var deleteBatch = FS.batch();
    S.creditos.forEach(function(c){
      deleteBatch.delete(FS.doc(P + 'creditos/' + c.id));
    });

    deleteBatch.commit().then(function(){
      var done = 0;
      (function nx() {
        var ch = out.slice(done, done + 400);
        if (!ch.length) {
          $('st').textContent = 'Se importaron ' + out.length + ' apartados de forma limpia (sin duplicados)';
          el.value = '';
          render();
          return;
        }
        var b = FS.batch();
        ch.forEach(function(item) {
          b.set(FS.doc(P + 'creditos/' + item.id), item);
        });
        b.commit().then(function() {
          done += 400;
          nx();
        }).catch(function(e) {
          $('st').textContent = 'No se pudo importar los apartados: ' + e.message;
        });
      })();
    }).catch(function(e){
      $('st').textContent = 'Error al limpiar datos previos: ' + e.message;
    });
  };
  rd.readAsText(fl, 'text/plain');
}

function filterCreditos(el){
  CR_Q = el.value.trim().toLowerCase();
  CR_Limit = 50; // Reiniciar límite al buscar
  var container = $('creditos_list_container');
  if(container) container.innerHTML = renderCreditosList();
}

function cargarMasCreditos(){
  CR_Limit += 50;
  var container = $('creditos_list_container');
  if(container) container.innerHTML = renderCreditosList();
}

function renderCreditosList(){
  // Ordenar apartados por número de apartado de forma numérica y ascendente
  var sortedCreditos = S.creditos.slice().sort(function(a, b){
    var numA = parseInt(String(a.num || '').replace(/\D/g, '')) || 0;
    var numB = parseInt(String(b.num || '').replace(/\D/g, '')) || 0;
    if(numA !== numB) return numA - numB;
    return (a.fecha || '').localeCompare(b.fecha || '');
  });

  var filtered = sortedCreditos.filter(function(c){
    if(!CR_Q) return true;
    var n = c.nombre.toLowerCase();
    var t = (c.tel || '').toLowerCase();
    var num = (c.num || '').toLowerCase();
    return n.indexOf(CR_Q) >= 0 || t.indexOf(CR_Q) >= 0 || num.indexOf(CR_Q) >= 0;
  });

  if(!filtered.length){
    return '<div class="card"><p class="mu" style="margin:4px 0">No se encontraron apartados con ese número, nombre o teléfono.</p></div>';
  }

  var paginated = filtered.slice(0, CR_Limit);

  var html = paginated.map(function(c){
    var pendiente = Math.round((c.monto - c.pagado) * 100) / 100;
    var diasPlazo = parseInt(c.plazo) || 0;
    var fechaLimite = diasPlazo > 0 ? addDays(c.fecha, diasPlazo) : '';
    var isAtrasado = (diasPlazo > 0 && pendiente > 0 && fechaLimite < today());
    
    var estado = pendiente <= 0 ? '<span class="bd ok">Pagado</span>' : (isAtrasado ? '<span class="bd bad">⚠️ Atrasado</span>' : '<span class="bd">Pendiente</span>');
    
    var cardHtml = '<div class="card">'
       + '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div>'
       + (c.num ? '<small class="mu" style="font-weight:600">NÚMERO DE APARTADO: #' + esc(c.num) + '</small>' : '')
       + '<b>'+esc(c.nombre)+'</b> '+estado
       + '<small class="mu">Inicio: '+shDot(c.fecha)+(diasPlazo ? ' · Plazo: ' + diasPlazo + ' días (Vence: ' + shDot(fechaLimite) + ')' : '')+(c.tel?' · Tel: '+esc(c.tel):'')+'</small>'
       + '<small>'+esc(c.desc||'Sin descripción')+'</small>'
       + '</div><div style="display:flex;gap:4px"><button style="border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 8px;font-size:12px" onclick="editCredito(\''+c.id+'\')">Editar</button><button style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:4px 8px;font-size:12px" onclick="eliminarCredito(\''+c.id+'\')">Eliminar</button></div></div>'
       + '<div style="margin-top:8px;display:flex;justify-content:space-between;font-size:14px"><span>Total: <b>'+money(c.monto)+'</b></span><span>Abonado: <b class="pos">'+money(c.pagado)+'</b></span><span>Resta: <b class="neg">'+money(pendiente)+'</b></span></div>';
    
    cardHtml += '<div style="margin-top:10px;display:flex;gap:6px">';
    if(pendiente > 0){
      cardHtml += '<input id="abono_'+c.id+'" type="number" inputmode="decimal" step="0.01" placeholder="Monto a abonar" style="margin:0">'
         + '<button class="pri" style="width:auto;padding:0 14px" onclick="abonarCredito(\''+c.id+'\')">Abonar</button>';
    }
    cardHtml += '<button class="pri" style="width:auto;padding:0 14px;background:var(--ok);color:#fff" onclick="enviarReporteCliente(\''+c.id+'\')">📤 Enviar Reporte</button>';
    cardHtml += '</div>';

    cardHtml += '</div>';
    return cardHtml;
  }).join('');

  if(filtered.length > CR_Limit){
    html += '<button type="button" class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);margin-top:8px" onclick="cargarMasCreditos()">Cargar más apartados (' + (filtered.length - CR_Limit) + ' restantes)</button>';
  }

  return html;
}

        + '<input id="cr_plazo" type="number" inputmode="numeric" placeholder="Plazo máximo (días)" value="'+(edObj ? esc(edObj.plazo||'') : '')+'">'

        + '<input id="cr_tel" placeholder="Teléfono" inputmode="tel" value="'+(edObj ? esc(edObj.tel||'') : '')+'">'
        + '<input id="cr_desc" placeholder="Descripción de la compra (ej: Ropa, zapatos...)" value="'+(edObj ? esc(edObj.desc||'') : '')+'">'
        + '<div class="row">'

        + '<input type="number" id="cr_monto" inputmode="decimal" step="0.01" min="0" placeholder="Monto total de compra" value="'+(edObj ? edObj.monto : '')+'">'
        + '<input type="number" id="cr_pagado" inputmode="decimal" step="0.01" min="0" placeholder="Abono inicial (adelanto)" value="'+(edObj ? esc(edObj.pagado||''):'')+'">'
        + '</div>'
        + '<button class="pri" onclick="saveCreditoItem()">'+(edObj ? 'Guardar Cambios' : 'Registrar Apartado')+'</button>'
        + (edObj ? '<button class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="cancelEditCredito()">Cancelar</button>' : '')
        + '</div>'
        + '<h2>Buscar cliente</h2>'
        + '<input type="text" id="cr_search" placeholder="Buscar por número, nombre o teléfono..." value="'+esc(CR_Q)+'" oninput="filterCreditos(this)">'
        + '<h2>Reporte y listado de apartados activos</h2>'

  return h;

var dvArticulosTemp = [];

function agregarArticuloTemp(desc, precio){
  dvArticulosTemp.push({desc: desc || '', precio: parseFloat(precio) || 0});
  renderArticulosTempList();
}

function quitarArticuloTemp(index){
  dvArticulosTemp.splice(index, 1);
  renderArticulosTempList();
}

function renderArticulosTempList(){
  var container = $('dv_articulos_container');
  if(!container) return;
  if(!dvArticulosTemp.length){
    container.innerHTML = '<p class="mu">Aún no hay artículos agregados.</p>';
    actualizarTotalVentaCalculado();
    return;
  }
  var html = dvArticulosTemp.map(function(art, idx){
    return '<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">'
      + '<input type="text" placeholder="Nombre/Descripción del artículo" value="'+esc(art.desc)+'" oninput="dvArticulosTemp['+idx+'].desc=this.value" style="margin:0;flex:2">'
      + '<input type="number" inputmode="decimal" step="0.01" placeholder="Precio" value="'+(art.precio || '')+'" oninput="dvArticulosTemp['+idx+'].precio=parseFloat(this.value)||0; actualizarTotalVentaCalculado();" style="margin:0;flex:1">'
      + '<button type="button" style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:8px 12px" onclick="quitarArticuloTemp('+idx+')">✕</button>'
      + '</div>';
  }).join('');
  container.innerHTML = html;
  actualizarTotalVentaCalculado();
}

function actualizarTotalVentaCalculado(){
  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var envio = parseFloat($('dv_envio') ? $('dv_envio').value : 0) || 0;
  var total = subtotal + envio;
  if($('dv_total_preview')) $('dv_total_preview').textContent = '₡' + money(total);
}

function saveDetalleVentaItem(){
  var fecha = $('dv_fecha').value || today();
  var nombre = $('dv_nombre').value.trim();
  var tel = $('dv_tel').value.trim();
  var provincia = $('dv_provincia').value.trim();
  var canton = $('dv_canton').value.trim();
  var distrito = $('dv_distrito').value.trim();
  var otrosDatos = $('dv_otros').value.trim();
  var envio = parseFloat(String($('dv_envio').value).replace(',','.')) || 0;
  var guia = $('dv_guia').value.trim();

  if(!nombre){
    $('st').textContent = 'Indica el nombre del cliente';
    return;
  }
  if(!dvArticulosTemp.length){
    $('st').textContent = 'Agrega al menos un artículo a la venta';
    return;
  }
  
  var invalidArt = dvArticulosTemp.some(function(art){ return !art.desc.trim() || !(art.precio > 0); });
  if(invalidArt){
    $('st').textContent = 'Todos los artículos deben tener descripción y un precio mayor a 0';
    return;
  }

  if(guia){
    var duplicada = S.items.find(function(item){
      return item.t === 'v' && item.dvMeta && item.dvMeta.guia === guia && item.id !== edDvId;
    });
    if(duplicada){
      if(!confirm('⚠️ Atención: El número de guía ' + guia + ' ya fue registrado previamente en la venta de "' + (duplicada.dvMeta.nombre || 'otro cliente') + '". ¿Desea guardarlo de todos modos?')){
        return;
      }
    }
  }

  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var montoTotal = subtotal + envio;
  if(!(montoTotal > 0)){
    $('st').textContent = 'El monto total debe ser mayor a 0';
    return;
  }

  var id = edDvId || ('dv-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  
  var ventaObj = {
    id: id,
    t: 'v',
    d: fecha,
    n: 'Venta: ' + nombre + (guia ? ' (Guía: ' + guia + ')' : ''),
    a: Math.round(montoTotal * 100) / 100,
    dvMeta: {
      nombre: nombre,
      tel: tel,
      provincia: provincia,
      canton: canton,
      distrito: distrito,
      otrosDatos: otrosDatos,
      articulos: dvArticulosTemp,
      envio: Math.round(envio * 100) / 100,
      guia: guia
    }
  };

  if(DB){
    DB.doc(P + 'items/' + id).set(ventaObj).then(function(){
      edDvId = null;
      dvArticulosTemp = [];
      $('st').textContent = 'Venta detallada guardada correctamente en la base de datos';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al guardar venta: ' + e.message;
    });
  }
}

function editDetalleVenta(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  edDvId = id;
  
  setTimeout(function(){
    if($('dv_fecha')) $('dv_fecha').value = item.d;
    if($('dv_guia')) $('dv_guia').value = item.dvMeta.guia || '';
    if($('dv_nombre')) $('dv_nombre').value = item.dvMeta.nombre || '';
    if($('dv_tel')) $('dv_tel').value = item.dvMeta.tel || '';
    if($('dv_envio')) $('dv_envio').value = item.dvMeta.envio || '';
    if($('dv_provincia')) $('dv_provincia').value = item.dvMeta.provincia || '';
    if($('dv_canton')) $('dv_canton').value = item.dvMeta.canton || '';
    if($('dv_distrito')) $('dv_distrito').value = item.dvMeta.distrito || '';
    if($('dv_otros')) $('dv_otros').value = item.dvMeta.otrosDatos || '';
  }, 50);

  dvArticulosTemp = JSON.parse(JSON.stringify(item.dvMeta.articulos || []));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelEditDetalleVenta(){
  edDvId = null;
  dvArticulosTemp = [];
  render();
}

function eliminarDetalleVenta(id){
  if(!confirm('¿Seguro que deseas eliminar esta venta detallada?')) return;
  if(DB){
    DB.doc(P + 'items/' + id).delete().then(function(){
      $('st').textContent = 'Venta eliminada';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al eliminar: ' + e.message;
    });
  }
}

function ingresarGuiaRapida(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  
  var actualGuia = item.dvMeta.guia || '';
  var nuevaGuia = prompt('Escanee con la pistola de código de barras o digite el número de guía:', actualGuia);
  
  if(nuevaGuia === null) return;
  
  nuevaGuia = nuevaGuia.trim();

  if(nuevaGuia){
    var duplicada = S.items.find(function(it){
      return it.id !== id && it.t === 'v' && it.dvMeta && it.dvMeta.guia === nuevaGuia;
    });
    if(duplicada){
      alert('⚠️ Alerta: El número de guía ' + nuevaGuia + ' ya fue asignado a otra venta (' + (duplicada.dvMeta.nombre || '') + ').');
    }
  }

  item.dvMeta.guia = nuevaGuia;
  var cliente = item.dvMeta.nombre;
  item.n = 'Venta: ' + cliente + (nuevaGuia ? ' (Guía: ' + nuevaGuia + ')' : '');

  if(DB){
    DB.doc(P + 'items/' + id).set(item, {merge:true}).then(function(){
      $('st').textContent = 'Número de guía actualizado correctamente';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al actualizar guía: ' + e.message;
    });
  }
}

  return html;
}

function detallesVentasSection(){
  var ventasTodas = S.items.filter(function(i){ return i.t === 'v' && i.dvMeta; });
  var totalVentasDetalladas = ventasTodas.reduce(function(acc, v){ return acc + (v.a || 0); }, 0);
  var edObj = edDvId ? S.items.filter(function(i){ return i.id === edDvId; })[0] : null;

  if(edObj && edObj.dvMeta && dvArticulosTemp.length === 0){
    dvArticulosTemp = JSON.parse(JSON.stringify(edObj.dvMeta.articulos || []));
  }

  var h = '<div class="grid">'
        + '<div class="k bal"><span>Total Ventas Registradas (Detalladas)</span><b class="pos">'+money(totalVentasDetalladas)+'</b></div>'
        + '</div>'
        + '<h2>'+(edObj ? 'Editar venta detallada' : 'Registrar nueva venta')+'</h2>'
        + '<div class="card">'
        + '<div class="row">'
        + '<input type="date" id="dv_fecha" value="'+(edObj ? edObj.d : today())+'">'
        + '<input id="dv_guia" placeholder="Número de guía (manual o escáner)" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.guia||'') : '')+'">'
        + '</div>'
        + '<input id="dv_nombre" placeholder="1) Nombre del Cliente" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.nombre||'') : '')+'">'
        + '<input id="dv_tel" placeholder="2) Número de teléfono" inputmode="tel" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.tel||'') : '')+'">'
        
        + '<h2>3) Artículos de la venta</h2>'
        + '<div id="dv_articulos_container"></div>'
        + '<button type="button" class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);margin-bottom:10px" onclick="agregarArticuloTemp(\'\', \'\')">+ Agregar Artículo</button>'

        + '<h2>4) Datos para el envío</h2>'
        + '<input id="dv_envio" type="number" inputmode="decimal" step="0.01" placeholder="Monto de envío" value="'+(edObj && edObj.dvMeta ? edObj.dvMeta.envio : '')+'" oninput="actualizarTotalVentaCalculado()">'
        + '<div class="row">'
        + '<input id="dv_provincia" placeholder="Provincia" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.provincia||'') : '')+'">'
        + '<input id="dv_canton" placeholder="Cantón" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.canton||'') : '')+'">'
        + '<input id="dv_distrito" placeholder="Distrito" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.distrito||'') : '')+'">'
        + '</div>'
        + '<input id="dv_otros" placeholder="Otros datos para especificar (señas, color de casa...)" value="'+(edObj && edObj.dvMeta ? esc(edObj.dvMeta.otrosDatos||'') : '')+'">'

        + '<div style="margin:10px 0;text-align:right;font-size:16px">Total Venta + Envío: <b id="dv_total_preview" class="pos">₡0.00</b></div>'
        + '<button type="button" class="pri" onclick="saveDetalleVentaItem()">'+(edObj ? 'Guardar Cambios' : 'Registrar Venta')+'</button>'
        + (edObj ? '<button type="button" class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="cancelEditDetalleVenta()">Cancelar</button>' : '')
        + '</div>'

        + '<h2>Buscar cliente o guía</h2>'
        + '<input type="text" id="dv_search_text" placeholder="Buscar por nombre, teléfono o número de guía..." value="'+esc(DV_SEARCH_Q)+'" oninput="filterDetalleVentasTexto(this)">'

        + '<h2>Filtrar ventas por día</h2>'
        + '<input type="date" id="dv_filter_date" value="'+esc(DV_Q)+'" onchange="filterDetalleVentas(this)">'
        + '<label class="chk"><input type="checkbox" id="dv_today_chk" '+(DV_Today ? 'checked' : '')+' onchange="toggleDetalleVentasToday(this)"> Seleccionar el día de hoy</label>'
        + ((DV_Q || DV_SEARCH_Q) ? '<button type="button" class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);margin:8px 0 12px" onclick="DV_Q=\'\';DV_SEARCH_Q=\'\';$(\'dv_filter_date\').value=\'\';$(\'dv_search_text\').value=\'\';render()">Ver todas las ventas</button>' : '')

        + '<h2>Listado de ventas detalladas</h2>'
        + '<div id="dv_list_container">' + renderDetallesVentasList() + '</div>';

  return h;
}

function summary(wi){
  var s=sum(wi),g=sum(S.items);
  
  var totalApartadosPendientes = 0;
  S.creditos.forEach(function(c){
    totalApartadosPendientes += (c.monto - c.pagado);
  });

  var fx=function(a){var e=0,n=0;a.forEach(function(i){if(i.t==='f'){if(i.e)e+=i.a;else n+=i.a}});return 'Facturas electrónicas '+money(e)+' · No electrónicas '+money(n)};
  
  var cards=function(r,x){
    x=x||0;
    var balanceReal = r.b + x;
    return '<div class="grid">'
      + '<div class="k"><span>Ventas</span><b>'+money(r.v)+'</b></div>'
      + '<div class="k"><span>Facturas</span><b>'+money(r.f)+'</b></div>'
      + '<div class="k"><span>Gastos</span><b>'+money(r.g)+'</b></div>'
      + '<div class="k bal"><span>Balance</span><b class="'+cls(balanceReal)+'">'+money(balanceReal)+'</b></div>'
      + '</div>';
  };

  var globalCards=function(r,x){
    x=x||0;
    var balanceReal = r.b + x;
    var balanceProyectado = balanceReal + totalApartadosPendientes;
    return '<div class="grid">'
      + '<div class="k"><span>Ventas</span><b>'+money(r.v)+'</b></div>'
      + '<div class="k"><span>Facturas</span><b>'+money(r.f)+'</b></div>'
      + '<div class="k"><span>Gastos</span><b>'+money(r.g)+'</b></div>'
      + '<div class="k"><span>Total por Cobrar (Pendiente)</span><b class="neg">'+money(totalApartadosPendientes)+'</b></div>'
      + '<div class="k bal"><span>Balance global</span><b class="'+cls(balanceReal)+'">'+money(balanceReal)+'</b></div>'
      + '<div class="k bal"><span>Balance global proyectado (Tomando en cuenta apartados)</span><b class="'+cls(balanceProyectado)+'">'+money(balanceProyectado)+'</b></div>'
      + '</div>';
  };

  var h='<h2>Balance de la semana</h2>'+cards(s)+'<p class="mu">'+fx(wi)+'</p>'+period(cards,fx);
  
  var ws={};S.items.filter(function(i){return i&&i.d}).forEach(function(i){var w=wk(i.d);(ws[w]=ws[w]||[]).push(i)});
  var keys=Object.keys(ws).sort().reverse();
  h+=chart(ws,keys)+'<h2>Semana por semana</h2>';
  if(!keys.length)return h+'<p class="mu">Aún no hay movimientos. Empieza en Det. Ventas, Facturas o Gastos.</p><h2>Balance global</h2>'+globalCards(g,S.saldo||0)+saldoBox();
  h+='<div class="card sc"><table><thead><tr><th>Semana</th><th>Ventas</th><th>Fact.</th><th>Gastos</th><th>Balance</th></tr></thead><tbody>';
  keys.forEach(function(w){var r=sum(ws[w]);h+='<tr><td>'+wl(w)+'</td><td>'+money(r.v)+'</td><td>'+money(r.f)+'</td><td>'+money(r.g)+'</td><td class="'+cls(r.b)+'">'+money(r.b)+'</td></tr>'});
  h+='</tbody></table></div><h2>Mes por mes</h2><div class="card sc"><table><thead><tr><th>Mes</th><th>Ventas</th><th>Fact.</th><th>Gastos</th><th>Balance</th></tr></thead><tbody>';var MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],ms={};S.items.filter(function(i){return i&&i.d}).forEach(function(i){var m=i.d.slice(0,7);(ms[m]=ms[m]||[]).push(i)});Object.keys(ms).sort().reverse().forEach(function(m){var r=sum(ms[m]);h+='<tr><td>'+MN[+m.slice(5)-1]+' '+m.slice(0,4)+'</td><td>'+money(r.v)+'</td><td>'+money(r.f)+'</td><td>'+money(r.g)+'</td><td class="'+cls(r.b)+'">'+money(r.b)+'</td></tr>'});h+='</tbody></table></div><h2>Balance global</h2>'+globalCards(g,S.saldo||0)+saldoBox()+'<p class="mu">'+fx(S.items)+'</p>'+cat()+'<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="pri" style="flex:1" onclick="exp()">Exportar a CSV</button><button type="button" class="pri" style="flex:1;background:var(--ac)" onclick="expJSON()">📥 Descargar Backup JSON</button></div>'
    +(RO?'':'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><label class="pri" style="flex:1;display:block;text-align:center;background:none;color:var(--tx);border:1px solid var(--bd);cursor:pointer">Importar CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="imp(this)"></label><label class="pri" style="flex:1;display:block;text-align:center;background:none;color:var(--tx);border:1px solid var(--bd);cursor:pointer">📥 Restaurar Backup JSON<input type="file" accept=".json,application/json" style="display:none" onchange="impJSON(this)"></label></div>');
  return h;
}
var PH={v:'Nota (opcional)',f:'Proveedor (elige o escribe uno nuevo)',g:'Concepto del gasto'};
var TT={v:'Ventas diarias',f:'Facturas',g:'Gastos'};
function section(t,wi){
  var E=ed?S.items.filter(function(i){return i.id===ed})[0]:null;if(E&&E.t!==t)E=null;var dd=E?E.d:W===wk(today())?today():W;
  var list=wi.filter(function(i){return i.t===t&&!i.dvMeta}).sort(function(a,b){return a.d<b.d?1:-1});
  var tot=list.reduce(function(x,i){return x+i.a},0);
  var h='<div class="card"><div class="row"><input type="date" id="d" value="'+dd+'"><input type="number" id="a" inputmode="decimal" step="0.01" min="0" placeholder="Monto" value="'+(E?E.a:'')+'"><input id="n" placeholder="'+PH[t]+'" value="'+(E?esc(E.n):'')+'"'+(t==='f'?' list="pv" autocomplete="off"':'')+'></div>'+(t==='f'?'<datalist id="pv">'+PV().slice(1).map(function(p){return '<option value="'+esc(p[1])+'">'}).join('')+'</datalist>':'')+(t==='f'?'<input id="j" inputmode="numeric" maxlength="20" placeholder="Cédula jurídica (opcional)" value="'+(E&&E.j?esc(E.j):'')+'">':'')+(t==='g'?'<select id="c">'+CATS.map(function(c){return '<option'+(E&&E.c===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>':'')
    +(t==='f'?'<label class="chk"><input type="checkbox" id="e"'+(E&&E.e?' checked':'')+'> Factura electrónica</label>':'')
    +'<button type="button" class="pri" onclick="add(\''+t+'\')">'+(E?'Guardar cambios':'Agregar')+'</button>'+(E?'<button type="button" class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="ed=null;render()">Cancelar</button>':'')+'</div>';
  if(RO)h='<p class="mu">Solo lectura: tu acceso no permite registrar ni modificar movimientos.</p>';h+='<h2>'+TT[t]+' de la semana · '+money(tot)+'</h2><div class="card">';
  if(!list.length)h+='<p class="mu" style="margin:4px 0">Sin registros esta semana.</p>';
  list.forEach(function(i){
    h+='<div class="it"><div class="t"><b>'+money(i.a)+'</b>'
      +'<small>'+shDot(i.d)+(i.n?' · '+esc(i.n):'')+(t==='f'?' · '+(i.e?'Electrónica':'No electrónica'):'')+(t==='g'?' · '+esc(i.c):'')+(t==='f'&&i.j?' · Céd. '+esc(i.j):'')+'</small></div>'
      +'<button onclick="eds(\''+i.id+'\')">Editar</button><button onclick="del(\''+i.id+'\')">'+(pend===i.id?'¿Seguro?':'✕')+'</button></div>';
  });
  return h+'</div>';
}
function render(){
  var root=$('app');
  if(!C){root.className='';root.innerHTML=gateView();return}
  if(!ready){root.innerHTML='<p class="mu">Cargando…</p>';return}
  var wi=S.items.filter(function(i){return i&&i.d&&wk(i.d)===W});
  var tabsConfig=[['r','Resumen'],['dv','Det. Ventas'],['f','Facturas'],['g','Gastos'],['ah','Ahorros'],['cr','Apartados'],['b','Reportes']];
  var h='<div class="hd"><img src="'+LOGO+'" alt="Logo de Little Nani"><div><h1>Little Nani</h1><span class="mu">Cuentas del negocio</span></div><button class="lo" onclick="out()">Salir</button></div><div class="tabs">'+tabsConfig.map(function(p){return '<button class="'+(tab===p[0]?'on':'')+'" onclick="go(\''+p[0]+'\')">'+p[1]+'</button>'}).join('')+'</div>';
  if(tab!=='b'&&tab!=='ah'&&tab!=='cr'&&tab!=='dv')h+='<div class="wk"><button onclick="mv(-1)" aria-label="Semana anterior">‹</button><div><b>'+wl(W)+'</b><span class="mu">'+(W===wk(today())?'Esta semana':'&nbsp;')+'</span></div><button onclick="mv(1)" aria-label="Semana siguiente">›</button></div>';
  h+=tab==='r'?summary(wi):tab==='b'?search():tab==='ah'?ahorrosSection():tab==='cr'?creditosSection():tab==='dv'?detallesVentasSection():section(tab,wi);
  root.className=RO?'ro':'';root.innerHTML=h;
  if(tab==='dv'){ renderArticulosTempList(); }
}
init();
</script></body></html>
