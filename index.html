<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Nani · Cuentas</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e3e1d9;--ac:#2f6f5e;--ok:#1f7a4d;--bad:#b3392f;--wn:#a86a0f;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#a09f97;--bd:#3a3a36;--ac:#5fb59f;--ok:#58c28a;--bad:#ef7a6f;--wn:#e0a64a;--on:#10201b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--card:#222220;--tx:#efeee9;--mu:#a09f97;--bd:#3a3a36;--ac:#5fb59f;--ok:#58c28a;--bad:#ef7a6f;--wn:#e0a64a;--on:#10201b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 14px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.hd img{width:52px;height:52px;border-radius:50%;flex:none;background:#fff}
.hd h1{margin:0}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;padding:9px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:12px;white-space:nowrap;min-width:85px}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.wk div{text-align:center;display:flex;flex-direction:column}
.wk button{width:44px;height:40px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.k span{display:block;font-size:12px;color:var(--mu)}
.k b{font-size:18px}
.k.bal{grid-column:1/-1}
.k.bal b{font-size:24px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.card > .row input:nth-child(3){grid-column:1/-1}
.ro .it button{display:none}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.chk input{width:auto;margin:0}
.pri{width:100%;padding:11px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.it .t{flex:1;min-width:0;overflow-wrap:anywhere}
.it .t small{display:block;color:var(--mu)}
.it button{border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}
.bd{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--wn);color:var(--wn);margin-left:6px;background:none}
.bd.ok{border-color:var(--ok);color:var(--ok)}
.bd.bad{border-color:var(--bad);color:var(--bad)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600;font-size:12px}
tfoot td{font-weight:700;border-bottom:0}
.lo{margin-left:auto;border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}

.lb-page{width:6in;height:4in;padding:.1in;overflow:hidden;break-inside:avoid;page-break-inside:avoid;background:#fff}
.label-box{width:100%;height:100%;border:2px solid #000;padding:12px 20px;border-radius:6px;background:#fff;color:#000;font-family:Arial,sans-serif;box-sizing:border-box;position:relative;overflow:hidden}
.sender-container{position:absolute;top:12px;left:16px}
.sender-title{font-weight:bold;font-size:11px;margin-bottom:2px}
.sender-box{border:1.5px solid #000;padding:6px 8px;width:240px;font-size:10px;line-height:1.2}
.dest-title{font-weight:bold;font-size:18px;text-align:center;margin-bottom:6px}
.dest-container{position:absolute;bottom:12px;left:16px;right:16px;font-size:17px;line-height:1.35}
.dest-container.m{font-size:14px}.dest-container.s{font-size:12px}
.lbm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.lbm>div{background:var(--card);color:var(--tx);width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.lbm .ls{overflow-y:auto;flex:1;min-height:80px;margin:6px 0}
.lbm .it{cursor:pointer}
.lbm .it input{width:auto;margin:0;flex:none;transform:scale(1.25)}
.lbm .bt{display:flex;gap:8px;flex-wrap:wrap}
.lbm .bt button{flex:1;min-width:130px}
.lbm .sec{background:none;color:var(--tx);border:1px solid var(--bd)}
#print-label-area{display:none}
@page{margin:10mm}
@media print{html,body{margin:0;padding:0;background:#fff}.lb-page:not(:last-child){break-after:page;page-break-after:always}body>*:not(#print-label-area){display:none!important}#print-label-area{display:block!important}}

/* Panel financiero renovado: solo afecta la pestaña Resumen */
.dash-hero{background:linear-gradient(135deg,#173b59,#286d78);color:#fff;border-radius:18px;padding:18px;margin:4px 0 14px;box-shadow:0 8px 22px rgba(20,55,75,.14)}
.dash-hero .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.dash-hero .amount{font-size:30px;font-weight:750;line-height:1.2;margin:5px 0}
.dash-hero .sub{font-size:12px;opacity:.82}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0 14px}
.dash-tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;min-width:0}
.dash-tile .label{font-size:11px;color:var(--mu);display:block;margin-bottom:5px}
.dash-tile strong{font-size:19px;display:block;overflow-wrap:anywhere}
.dash-tile small{font-size:11px;color:var(--mu)}
.dash-section{margin-top:18px}
.dash-section h2{font-size:16px;color:var(--tx);font-weight:700;margin:0 0 9px}
.dash-panel{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:13px;margin-bottom:10px}
.dash-bars{display:flex;align-items:flex-end;gap:8px;height:142px;padding:8px 2px 0;border-bottom:1px solid var(--bd)}
.dash-bar-group{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;position:relative}
.dash-bar{width: min(34%,18px);min-height:2px;border-radius:5px 5px 0 0}
.dash-bar.in{background:#279b79}.dash-bar.out{background:#e19a55}
.dash-bar-label{position:absolute;bottom:-20px;font-size:9px;color:var(--mu);white-space:nowrap}
.dash-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:25px}
.dash-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.dash-alert{border-left:4px solid var(--wn);background:var(--card);padding:10px 12px;border-radius:9px;margin:7px 0;font-size:13px}
.dash-alert.good{border-left-color:var(--ok)}.dash-alert.bad{border-left-color:var(--bad)}
.dash-change{font-size:11px;margin-top:5px}.dash-change.up{color:var(--ok)}.dash-change.down{color:var(--bad)}
.dash-wide{grid-column:1/-1}
@media(min-width:560px){.dash-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.dash-tile.hero-small{grid-column:span 2}}

</style>

  if(DB)DB.doc(P+'items/'+it.id).set(it).catch(function(e){$('st').textContent='No se pudo guardar: '+e.message});
}

function expReporteProveedoresCSV(){
  var jd=String(Q.j||'').replace(/\D/g,''),qq=Q.q.trim().toLowerCase(),a=parseFloat(String(Q.a).replace(',','.')),b=parseFloat(String(Q.b).replace(',','.'));
  var l=S.items.filter(function(i){return (!Q.t||i.t===Q.t)&&(!Q.c||i.c===Q.c)&&(!qq||(i.t==='f'&&(i.n||'').trim().toLowerCase()===qq))&&(isNaN(a)||i.a>=a)&&(isNaN(b)||i.a<=b)&&(!Q.f||i.d>=Q.f)&&(!Q.h||i.d<=Q.h)&&(!jd||String(i.j||'').replace(/\D/g,'')===jd)});
  
  var facturasFiltradas = l.filter(function(i){ return i.t === 'f'; });
  var provMap = {};

  facturasFiltradas.forEach(function(f){
    var provName = (f.n || '').trim() || 'Sin proveedor';
    var cedula = (f.j || '').trim();
    if(!provMap[provName]){
      provMap[provName] = { elec: 0, noElec: 0, cedula: cedula };
    } else if(!provMap[provName].cedula && cedula) {
      provMap[provName].cedula = cedula;
    }
    if(f.e){
      provMap[provName].elec += f.a;
    } else {
      provMap[provName].noElec += f.a;
    }
  });

  var qEsc=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
  var rows = [['Proveedor', 'Cédula Jurídica', 'Total Facturas Electrónicas', 'Total Facturas No Electrónicas', 'Total General']];
  
  Object.keys(provMap).sort().forEach(function(prov){
    var item = provMap[prov];
    var totalProv = item.elec + item.noElec;
    rows.push([prov, item.cedula, item.elec, item.noElec, totalProv]);
  });

  var b = new Blob(['\ufeff'+rows.map(function(r){return r.map(qEsc).join(',')}).join('\n')],{type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'reporte-facturas-proveedores-'+shDot(today()).replace(/\//g,'-')+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

function saveAhorro(k, catName){
  var el = $('ah_' + k);
  if (!el) return;

  var nuevoTotal = parseFloat(String(el.value).trim().replace(',','.'));
  if (!isFinite(nuevoTotal) || nuevoTotal < 0) {
    $('st').textContent = 'Escribe un monto válido (cero o mayor)';
    return;
  }

  var reg = S.items
    .filter(function(i){
      return i.t === 'g' && i.c === catName;
    })
    .reduce(function(acc, i){
      return acc + (Number(i.a) || 0);
    }, 0);

  var nuevoBase = Math.round((nuevoTotal - reg) * 100) / 100;

  S.ahorros[k] = nuevoBase;
  
  if(DB){
    DB.doc(P+'config/main').set({ahorros: S.ahorros},{merge:true}).then(function(){
      edAh = null;
      $('st').textContent = 'Ahorro actualizado correctamente';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al guardar ahorro: '+e.message;
    });
  } else {
    edAh = null;
    $('st').textContent = 'Ahorro actualizado correctamente';
    render();
  }
}
function ahorrosSection(){
  var subs=[
    {id:'casa',title:'Ahorro Casa',cat:'Ahorro Casa'},
    {id:'viaje',title:'Ahorro Viaje',cat:'Ahorro Viaje'},
    {id:'ninos',title:'Ahorro Niños',cat:'Ahorro Niños'}
  ];
  var totAhorros=0;
  var cardsHtml=subs.map(function(s){
    var base=S.ahorros[s.id]||0;
    var itemsAhorro = S.items.filter(function(i){
      if(i.t!=='g'||i.c!==s.cat) return false;
      return true;
    });
    var reg=itemsAhorro.reduce(function(acc,i){return acc+i.a},0);
    var total=base+reg;
    totAhorros+=total;
    
    var body='';
    if(edAh===s.id){
      body='<label class="mu">Monto total desplegado para '+s.title+'</label><input id="ah_'+s.id+'" type="number" inputmode="decimal" step="0.01" value="'+total+'"><button class="pri" onclick="saveAhorro(\''+s.id+'\',\''+s.cat+'\')">Guardar</button><button class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="edAh=null;render()">Cancelar</button>';
    }else{
      body='<div class="it"><div class="t"><b>'+money(total)+'</b><small>Monto base: '+money(base)+' · Registrado en Gastos: '+money(reg)+'</small></div><button onclick="edAh=\''+s.id+'\';render()">Editar total</button></div>';
    }

    var listadoRegistros = '';
    if(itemsAhorro.length > 0){
      listadoRegistros = '<div style="margin-top:8px; border-top:1px solid var(--bd); padding-top:6px;"><small class="mu"><b>Registros en gastos:</b></small>'
        + itemsAhorro.map(function(i){
            return '<div class="it" style="padding:4px 0; border:0"><div class="t"><small>'+shDot(i.d)+' · '+esc(i.n||'Sin detalle')+'</small><b>'+money(i.a)+'</b></div><button onclick="del(\''+i.id+'\')">Eliminar</button></div>';
          }).join('') + '</div>';
    }

    return '<h2>'+s.title+'</h2><div class="card">'+body+listadoRegistros+'</div>';
  }).join('');

  return '<div class="grid"><div class="k bal"><span>Total Ahorrado / Apartado</span><b class="pos">'+money(totAhorros)+'</b></div></div>'+cardsHtml;
}

function casaApartarSemana(){
  var mInput = prompt('Monto sugerido para apartar esta semana:', '160000');
  if(mInput === null) return;
  var monto = parseFloat(mInput.replace(',','.'));
  if(!(monto > 0)){ alert('Monto inválido'); return; }
  
  var w = wk(today());
  var yaApartado = S.items.some(function(i){ return i.t === 'g' && i.c === 'Fondo Casa' && wk(i.d) === w; });
  if(yaApartado){
    if(!confirm('⚠️ Ya existe un apartado de Fondo de la Casa registrado en esta semana. ¿Deseas registrar otro de todas formas?')) return;
  }

  var it = {
    id: 'casa-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    t: 'g',
    d: today(),
    n: 'Apartado semanal Fondo de la Casa',
    c: 'Fondo Casa',
    a: Math.round(monto * 100) / 100
  };

  put(it);
  $('st').textContent = 'Apartado semanal guardado correctamente';
  render();
}

function casaEsPago(i){return i.t==='g'&&i.c!=='Fondo Casa'&&(i.c==='Gastos Casa'||i.c==='Pago Casa'||(i.n||'').indexOf('Pago Casa')>=0)}
function casaTotales(){var ap=0,pg=0;S.items.forEach(function(i){if(i.t!=='g')return;if(i.c==='Fondo Casa')ap+=Number(i.a)||0;else if(casaEsPago(i))pg+=Number(i.a)||0});ap=r2(ap);pg=r2(pg);return{apartado:ap,pagado:pg,disponible:r2(ap-pg)}}
function casaLiquidarSobrante(){
  alert('La liquidación manual está deshabilitada para evitar registrar un gasto ficticio. El remanente permanece en el Fondo de la Casa.');
}

function casaPagarRubro(nombreRubro, montoPorDefecto){
  if(BUSY['rubro_' + nombreRubro]) return;
  var el = $('rubro_monto_' + nombreRubro);
  if(!el) return;
  var monto = parseFloat(String(el.value).trim().replace(',','.'));
  if(!isFinite(monto) || !(monto > 0)){ alert('Monto inválido'); return; }

  var disponible = casaTotales().disponible;

  if(monto > disponible){
    if(!confirm('⚠️ El monto a pagar (₡' + money(monto) + ') supera el fondo disponible de la casa (₡' + money(disponible) + '). ¿Deseas registrarlo de todas formas?')) return;
  }

  var catDestino = (nombreRubro === 'Ahorro Niños') ? 'Ahorro Niños' : 'Gastos Casa';

  var it = {
    id: 'casapago-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    t: 'g',
    d: today(),
    n: 'Pago Casa: ' + nombreRubro,
    c: catDestino,
    a: Math.round(monto * 100) / 100
  };

  BUSY['rubro_' + nombreRubro] = true;
  setTimeout(function(){ BUSY['rubro_' + nombreRubro] = false; }, 3000);

  put(it);
  // Ahorro Niños se refleja desde el movimiento de gasto; no se suma también al monto base.
  $('st').textContent = 'Pago de ' + nombreRubro + ' registrado correctamente';
  render();
}

function guardarCuentasBancarias(){
  if(RO){$('st').textContent='Tu acceso es de solo lectura';return}
  var nuevos={},hayUSD=false,errorMonto='';
  CUENTAS_BANCOS.forEach(function(x){

  if(hayUSD&&fx<=0){alert('Debes indicar el tipo de cambio USD → CRC porque hay saldos en dólares.');return}

  S.cuentas=nuevos;S.tipoCambioUSD=fx;

    n:'Abono apartado'+(c.num?' #'+c.num:'')+' · '+c.nombre,a:Math.round(monto*100)/100,ap:c.id,cl:c.nombre};
}
function saveCreditoItem(){
  if(BUSY.save) return;
  var num = $('cr_num').value.trim();
  var nombre = $('cr_nombre').value.trim();
  var tel = $('cr_tel').value.trim();
  var desc = $('cr_desc').value.trim();
  var plazo = parseInt($('cr_plazo').value) || 0;
  var monto = parseFloat(String($('cr_monto').value).replace(',','.'));
  var pagado = parseFloat(String($('cr_pagado').value).replace(',','.')) || 0;
  var fecha = $('cr_fecha').value || today();

  if(!nombre || !(monto > 0)){
    $('st').textContent = 'Indica el nombre del cliente y un monto total válido';
    return;
  }

  if(pagado > monto) pagado = monto;

  var uniqueKey = (num ? num : '') + '|' + nombre.toLowerCase() + '|' + fecha;
  var id = edCrId || ('cr-' + hs(uniqueKey));
  if(!edCrId && S.creditos.some(function(c){ return c.id === id; })) id = id + '-' + Date.now().toString(36);
  var prevCr = edCrId ? S.creditos.filter(function(c){ return c.id === edCrId; })[0] : null;
  if(prevCr){
    var regAb = S.items.filter(function(i){ return i.t === 'v' && i.ap === edCrId; }).reduce(function(x,i){ return x + (Number(i.a)||0); }, 0);
    if(pagado < regAb - 0.005){
      $('st').textContent = 'Lo pagado no puede ser menor a los abonos ya registrados como ventas (₡' + money(regAb) + '). Para quitar uno usa «Deshacer abono» en Det. Ventas.';
      return;
    }
  }
  var creditoObj = {
    id: id,
    num: num,
    nombre: nombre,
    tel: tel,
    desc: desc,
    plazo: plazo,
    monto: Math.round(monto * 100) / 100,
    pagado: Math.round(pagado * 100) / 100,
    fecha: fecha
  };

  if(DB){
    var esNuevo = !edCrId;
    var bs = FS.batch();
    bs.set(FS.doc(P + 'creditos/' + id), creditoObj);
    if(esNuevo && creditoObj.pagado > 0){
      var vi = ventaAbono(creditoObj, creditoObj.pagado, fecha);
      bs.set(FS.doc(P + 'items/' + vi.id), vi);
    }
    if(prevCr){
      var difPag = Math.round((creditoObj.pagado - (prevCr.pagado||0))*100)/100;
      if(difPag > 0){
        var vd = ventaAbono(creditoObj, difPag, today());
        bs.set(FS.doc(P + 'items/' + vd.id), vd);
      }
    }
    BUSY.save = true;
    setTimeout(function(){ BUSY.save = false; }, 8000);
    bs.commit().then(function(){
      BUSY.save = false;
      edCrId = null;
      $('st').textContent = 'Apartado guardado en la base de datos';
      render();
    }).catch(function(e){
      BUSY.save = false;
      $('st').textContent = 'Error al guardar: ' + e.message;
    });
  }
}

function abonarCredito(id){
  if(BUSY[id]) return;
  var el = $('abono_' + id);
  if(!el) return;
  var abono = parseFloat(String(el.value).replace(',','.'));
  if(!(abono > 0)){
    $('st').textContent = 'Escribe un monto de abono válido';
    return;
  }

  var cr = S.creditos.find(function(c){ return c.id === id; });
  if(cr){
    var pendiente = Math.round((cr.monto - cr.pagado)*100)/100;
    if(abono > pendiente) abono = pendiente;
    abono = Math.round(abono*100)/100;
    if(!(abono > 0)){ $('st').textContent = 'Este apartado ya está pagado'; return; }

    if(DB && firebase.firestore && firebase.firestore.FieldValue){
      var vb = ventaAbono(cr, abono, today());
      var bb = FS.batch();
      bb.update(FS.doc(P + 'creditos/' + id), { pagado: firebase.firestore.FieldValue.increment(abono) });
      bb.set(FS.doc(P + 'items/' + vb.id), vb);
      BUSY[id] = true;
      setTimeout(function(){ BUSY[id] = false; }, 8000);
      $('st').textContent = 'Guardando abono…';
      bb.commit().then(function(){
        BUSY[id] = false;
        $('st').textContent = 'Abono registrado correctamente';
        render();
      }).catch(function(e){
        BUSY[id] = false;
        $('st').textContent = 'Error al registrar abono: ' + e.message;
      });
    }
  }
}

function eliminarCredito(id){
  if(!confirm('¿Seguro que deseas eliminar este apartado?')) return;
  var abs = S.items.filter(function(i){ return i.t === 'v' && i.ap === id; });
  var quitar = false;
  if(abs.length){
    var totAb = abs.reduce(function(x,i){ return x + (Number(i.a)||0); }, 0);
    quitar = confirm('Este apartado tiene ' + abs.length + ' abono(s) por ₡' + money(totAb) + ' registrados como ventas.\n\nAceptar = eliminarlos también de las ventas.\nCancelar = conservarlos como ventas sueltas.');
  }
  if(DB){
    var delP;
    if(quitar){
      var bd = FS.batch();
      bd.delete(FS.doc(P + 'creditos/' + id));
      abs.forEach(function(i){ bd.delete(FS.doc(P + 'items/' + i.id)); });
      delP = bd.commit();
    } else {
      delP = DB.doc(P + 'creditos/' + id).delete();
    }
    delP.then(function(){
      $('st').textContent = 'Apartado eliminado';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al eliminar: ' + e.message;
    });
  }
}

function enviarSiguienteRecordatorio(){

function filterCreditos(el){

  if(container) container.innerHTML = renderCreditosList();
}

function cargarMasCreditos(){
  CR_Limit += 50;
  var container = $('creditos_list_container');
  if(container) container.innerHTML = renderCreditosList();
}

function renderCreditosList(){
  var sortedCreditos = S.creditos.slice().sort(function(a, b){
    var fa = a.fecha || '', fb = b.fecha || '';
    if(fa !== fb) return fa < fb ? 1 : -1;
    var numA = parseInt(String(a.num || '').replace(/\D/g, '')) || 0;
    var numB = parseInt(String(b.num || '').replace(/\D/g, '')) || 0;
    if(numA !== numB) return numB - numA;
    return String(b.id || '').localeCompare(String(a.id || ''));
  });

  var filtered = sortedCreditos.filter(function(c){
    if(CR_Atr && !crAtr(c)) return false;
    if(!CR_Q) return true;
    var n = c.nombre.toLowerCase();
    var t = (c.tel || '').toLowerCase();
    var num = (c.num || '').toLowerCase();
    return n.indexOf(CR_Q) >= 0 || t.indexOf(CR_Q) >= 0 || num.indexOf(CR_Q) >= 0;
  });

  if(!filtered.length){
    return '<div class="card"><p class="mu" style="margin:4px 0">'+(CR_Atr&&!CR_Q?'No hay apartados atrasados 🎉':'No se encontraron apartados con ese número, nombre o teléfono.')+'</p></div>';
  }

  var paginated = filtered.slice(0, CR_Limit);

  var html = paginated.map(function(c){
    var pendiente = Math.round((c.monto - c.pagado) * 100) / 100;
    var diasPlazo = parseInt(c.plazo) || 0;
    var fechaLimite = diasPlazo > 0 ? addDays(c.fecha, diasPlazo) : '';
    var isAtrasado = (diasPlazo > 0 && pendiente > 0 && fechaLimite < today());
    
    var estado = pendiente <= 0 ? '<span class="bd ok">Pagado</span>' : (isAtrasado ? '<span class="bd bad">⚠️ Atrasado</span>' : '<span class="bd">Pendiente</span>');
    
    var cardHtml = '<div class="card">'
       + '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div>'
       + (c.num ? '<small class="mu" style="font-weight:600">NÚMERO DE APARTADO: #' + esc(c.num) + '</small>' : '')
       + '<b>'+esc(c.nombre)+'</b> '+estado
       + '<small class="mu">Inicio: '+shDot(c.fecha)+(diasPlazo ? ' · Plazo: ' + diasPlazo + ' días (Vence: ' + shDot(fechaLimite) + ')' : '')+(c.tel?' · Tel: '+esc(c.tel):'')+'</small>'
       + '<small>'+esc(c.desc||'Sin descripción')+'</small>'
       + '</div><div style="display:flex;gap:4px"><button style="border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 8px;font-size:12px" onclick="editCredito(\''+c.id+'\')">Editar</button><button style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:4px 8px;font-size:12px" onclick="eliminarCredito(\''+c.id+'\')">Eliminar</button></div></div>'
       + '<div style="margin-top:8px;display:flex;justify-content:space-between;font-size:14px"><span>Total: <b>'+money(c.monto)+'</b></span><span>Abonado: <b class="pos">'+money(c.pagado)+'</b></span><span>Resta: <b class="neg">'+money(pendiente)+'</b></span></div>';
    
    cardHtml += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">';
    if(pendiente > 0){
      cardHtml += '<input id="abono_'+c.id+'" type="number" inputmode="decimal" step="0.01" placeholder="Monto a abonar" style="margin:0">'
         + '<button class="pri" style="width:auto;padding:0 14px" onclick="abonarCredito(\''+c.id+'\')">Abonar</button>';
    }
    cardHtml += '<button class="pri" style="width:auto;padding:0 14px;background:var(--ok);color:#fff" onclick="enviarReporteCliente(\''+c.id+'\')">📤 Enviar Reporte</button>';
    cardHtml += '<button class="pri" style="width:auto;padding:8px 14px;background:var(--ac)" onclick="imprimirReciboApartado(\''+c.id+'\')">🧾 Recibo</button>';
    cardHtml += '</div>';

    cardHtml += '</div>';
    return cardHtml;
  }).join('');

  if(filtered.length > CR_Limit){
    html += '<button type="button" class="pri" style="background:none;color:var(--tx);border:1px solid var(--bd);margin-top:8px" onclick="cargarMasCreditos()">Cargar más apartados (' + (filtered.length - CR_Limit) + ' restantes)</button>';
  }

  return html;
}

        + '</div>'
        + '<button class="pri" onclick="saveCreditoItem()">'+(edObj ? 'Guardar Cambios' : 'Registrar Apartado')+'</button>'
        + (edObj ? '<button class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="cancelEditCredito()">Cancelar</button>' : '')
        + '</div>'
        + (function(){
            var at=atrasados(),tv=at.reduce(function(a,c){return a+(c.monto-c.pagado)},0);
            return '<div class="card"><div class="grid"><div class="k"><span>Apartados atrasados</span><b class="'+(at.length?'neg':'')+'">'+at.length+'</b></div><div class="k"><span>Total vencido</span><b class="neg">'+money(tv)+'</b></div></div>'
              +'<label class="chk" style="margin-top:10px"><input type="checkbox" '+(CR_Atr?'checked':'')+' onchange="toggleAtrasados(this)"> Mostrar solo atrasados</label>'
              +(at.length?'<button class="pri" style="background:var(--ok);color:#fff" onclick="iniciarRecordatorios()">📲 Recordatorio por WhatsApp a todos los atrasados ('+at.length+')</button>':'')
              +'</div><div id="rm_panel">'+panelRM()+'</div>';
          })()
        + '<h2>Buscar cliente</h2>'
        + '<input type="text" id="cr_search" placeholder="Buscar por número, nombre o teléfono..." value="'+esc(CR_Q)+'" oninput="filterCreditos(this)">'

        + '<div id="creditos_list_container">' + renderCreditosList() + '</div>';

  return h;
}

var dvArticulosTemp = [];

function agregarArticuloTemp(desc, precio){
  dvArticulosTemp.push({desc: desc || '', precio: parseFloat(precio) || 0});
  renderArticulosTempList();
}

function quitarArticuloTemp(index){
  dvArticulosTemp.splice(index, 1);
  renderArticulosTempList();
}

function renderArticulosTempList(){
  var container = $('dv_articulos_container');
  if(!container) return;
  if(!dvArticulosTemp.length){
    container.innerHTML = '<p class="mu">Aún no hay artículos agregados.</p>';
    actualizarTotalVentaCalculado();
    return;
  }
  var html = dvArticulosTemp.map(function(art, idx){
    return '<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">'
      + '<input type="text" placeholder="Nombre/Descripción del artículo" value="'+esc(art.desc)+'" oninput="dvArticulosTemp['+idx+'].desc=this.value" style="margin:0;flex:2">'
      + '<input type="number" inputmode="decimal" step="0.01" placeholder="Precio" value="'+(art.precio || '')+'" oninput="dvArticulosTemp['+idx+'].precio=parseFloat(this.value)||0; actualizarTotalVentaCalculado();" style="margin:0;flex:1">'
      + '<button type="button" style="border:1px solid var(--bd);background:none;color:var(--bad);border-radius:8px;padding:8px 12px" onclick="quitarArticuloTemp('+idx+')">✕</button>'
      + '</div>';
  }).join('');
  container.innerHTML = html;
  actualizarTotalVentaCalculado();
}

function actualizarTotalVentaCalculado(){
  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var envio = parseFloat($('dv_envio') ? $('dv_envio').value : 0) || 0;
  var total = subtotal + envio;
  if($('dv_total_preview')) $('dv_total_preview').textContent = '₡' + money(total);
}

function saveDetalleVentaItem(){
  var fecha = $('dv_fecha').value || today();
  var nombre = $('dv_nombre').value.trim();
  var tel = $('dv_tel').value.trim();
  var provincia = $('dv_provincia').value.trim();
  var canton = $('dv_canton').value.trim();
  var distrito = $('dv_distrito').value.trim();
  var otrosDatos = $('dv_otros').value.trim();
  var envio = parseFloat(String($('dv_envio').value).replace(',','.')) || 0;
  var guia = $('dv_guia').value.trim();

  if(!nombre){
    $('st').textContent = 'Indica el nombre del cliente';
    return;
  }
  if(!dvArticulosTemp.length){
    $('st').textContent = 'Agrega al menos un artículo a la venta';
    return;
  }
  
  var invalidArt = dvArticulosTemp.some(function(art){ return !art.desc.trim() || !(art.precio > 0); });
  if(invalidArt){
    $('st').textContent = 'Todos los artículos deben tener descripción y un precio mayor a 0';
    return;
  }

  if(guia){
    var duplicada = S.items.find(function(item){
      return item.t === 'v' && item.dvMeta && item.dvMeta.guia === guia && item.id !== edDvId;
    });
    if(duplicada){
      if(!confirm('⚠️ Atención: El número de guía ' + guia + ' ya fue registrado previamente en la venta de "' + (duplicada.dvMeta.nombre || 'otro cliente') + '". ¿Desea guardarlo de todos modos?')){
        return;
      }
    }
  }

  var subtotal = dvArticulosTemp.reduce(function(acc, art){ return acc + (art.precio || 0); }, 0);
  var montoTotal = subtotal + envio;
  if(!(montoTotal > 0)){
    $('st').textContent = 'El monto total debe ser mayor a 0';
    return;
  }

  var id = edDvId || ('dv-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  
  var prevDv = edDvId ? S.items.filter(function(i){ return i.id === edDvId; })[0] : null;
  var ventaObj = {
    id: id,
    t: 'v',
    d: fecha,
    n: 'Venta: ' + nombre + (guia ? ' (Guía: ' + guia + ')' : ''),
    a: Math.round(montoTotal * 100) / 100,
    dvMeta: {
      nombre: nombre,
      tel: tel,
      provincia: provincia,
      canton: canton,
      distrito: distrito,
      otrosDatos: otrosDatos,
      articulos: dvArticulosTemp,
      envio: Math.round(envio * 100) / 100,
      guia: guia,
      guiaEnviada: (prevDv && prevDv.dvMeta && prevDv.dvMeta.guia === guia) ? (prevDv.dvMeta.guiaEnviada || '') : ''
    }
  };

  if(DB){
    DB.doc(P + 'items/' + id).set(ventaObj).then(function(){
      edDvId = null;
      dvArticulosTemp = [];
      $('st').textContent = 'Venta detallada guardada correctamente en la base de datos';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al guardar venta: ' + e.message;
    });
  }
}

function editDetalleVenta(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  edDvId = id;
  
  setTimeout(function(){
    if($('dv_fecha')) $('dv_fecha').value = item.d;
    if($('dv_guia')) $('dv_guia').value = item.dvMeta.guia || '';
    if($('dv_nombre')) $('dv_nombre').value = item.dvMeta.nombre || '';
    if($('dv_tel')) $('dv_tel').value = item.dvMeta.tel || '';
    if($('dv_envio')) $('dv_envio').value = item.dvMeta.envio || '';
    if($('dv_provincia')) $('dv_provincia').value = item.dvMeta.provincia || '';
    if($('dv_canton')) $('dv_canton').value = item.dvMeta.canton || '';
    if($('dv_distrito')) $('dv_distrito').value = item.dvMeta.distrito || '';
    if($('dv_otros')) $('dv_otros').value = item.dvMeta.otrosDatos || '';
  }, 50);

  dvArticulosTemp = JSON.parse(JSON.stringify(item.dvMeta.articulos || []));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function cancelEditDetalleVenta(){
  edDvId = null;
  dvArticulosTemp = [];
  render();
}

function eliminarDetalleVenta(id){
  if(!confirm('¿Seguro que deseas eliminar esta venta detallada?')) return;
  if(DB){
    DB.doc(P + 'items/' + id).delete().then(function(){
      $('st').textContent = 'Venta eliminada';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al eliminar: ' + e.message;
    });
  }
}

function ingresarGuiaRapida(id){
  var item = S.items.filter(function(i){ return i.id === id; })[0];
  if(!item || !item.dvMeta) return;
  
  var actualGuia = item.dvMeta.guia || '';
  var nuevaGuia = prompt('Escanee con la pistola de código de barras o digite el número de guía:', actualGuia);
  
  if(nuevaGuia === null) return;
  
  nuevaGuia = nuevaGuia.trim();

  if(nuevaGuia){
    var duplicada = S.items.find(function(it){
      return it.id !== id && it.t === 'v' && it.dvMeta && it.dvMeta.guia === nuevaGuia;
    });
    if(duplicada){
      alert('⚠️ Alerta: El número de guía ' + nuevaGuia + ' ya fue asignado a otra venta (' + (duplicada.dvMeta.nombre || '') + ').');
    }
  }

  if(nuevaGuia !== actualGuia) item.dvMeta.guiaEnviada = '';
  item.dvMeta.guia = nuevaGuia;
  var cliente = item.dvMeta.nombre;
  item.n = 'Venta: ' + cliente + (nuevaGuia ? ' (Guía: ' + nuevaGuia + ')' : '');

  if(DB){
    DB.doc(P + 'items/' + id).set(item, {merge:true}).then(function(){
      $('st').textContent = 'Número de guía actualizado correctamente';
      render();
    }).catch(function(e){
      $('st').textContent = 'Error al actualizar guía: ' + e.message;
    });
  }
}

  var it=S.items.filter(function(i){return i.id===id})[0];
  if(!it||!it.dvMeta)return;
  it.dvMeta.guiaEnviada=today();

  var v = item.dvMeta;

          + '🔍 *Enlace de rastreo:* https://correos.go.cr/rastreo/\n\n'
          + 'Ante cualquier consulta estamos a las órdenes. ¡Bonito día! ✨';

  if(v.tel){

function lbAbrir(){
  var r=ventasEnvioDelDia();
  if(!r.l.length){$('st').textContent='No hay ventas with datos de envío el '+shDot(r.dia);return}
  LB_ConGuia=!sinGuiaDelDia().l.length;
  lbArmar(true);
}
function lbArmar(todas){
  var r=ventasEnvioDelDia();
  LB_L=r.l.filter(function(i){return LB_ConGuia||!String(i.dvMeta.guia||'').trim()});
  var prev=LB_Sel;LB_Sel={};
  LB_L.forEach(function(i){LB_Sel[i.id]=todas?true:(prev[i.id]!==false)});
  var m=$('lb_modal');if(!m){m=document.createElement('div');m.id='lb_modal';m.className='lbm';document.body.appendChild(m)}
  m.onclick=function(e){if(e.target===m)lbCerrar()};
  var h='<div><b style="font-size:17px">Etiquetas del '+shDot(r.dia)+'</b><span class="mu">Desmarca las que no quieras imprimir o descargar.</span>'
    +'<label class="chk" style="margin:8px 0 0"><input type="checkbox" '+(LB_ConGuia?'checked':'')+' onchange="LB_ConGuia=this.checked;lbArmar(false)"> Incluir ventas que ya tienen guía</label>'
    +'<div class="ls">';
  if(!LB_L.length)h+='<p class="mu">No hay ventas para mostrar.</p>';
  LB_L.forEach(function(i,k){
    var v=i.dvMeta;
    h+='<label class="it"><input type="checkbox" '+(LB_Sel[i.id]?'checked':'')+' onchange="lbTog('+k+',this.checked)"><div class="t"><b>'+esc(v.nombre||'Sin nombre')+'</b><small>'+esc([v.provincia,v.canton,v.distrito].filter(Boolean).join(', '))+(String(v.guia||'').trim()?' · Guía: '+esc(v.guia):' · Sin guía')+'</small></div></label>';
  });
  h+='</div><div class="bt" style="margin-bottom:8px"><button type="button" class="pri sec" onclick="lbTodas(true)">Marcar todas</button><button type="button" class="pri sec" onclick="lbTodas(false)">Desmarcar todas</button></div>'
    +'<div class="bt"><button type="button" class="pri" onclick="lbImprimir()">🖨️ Imprimir (<span class="lbn">0</span>)</button><button type="button" class="pri" onclick="lbPDF()">⬇️ Descargar PDF (<span class="lbn">0</span>)</button><button type="button" class="pri sec" onclick="lbCerrar()">Cerrar</button></div></div>';
  m.innerHTML=h;lbCont();
}
function lbCont(){
  var n=LB_L.filter(function(i){return LB_Sel[i.id]}).length;
  Array.prototype.forEach.call(document.querySelectorAll('#lb_modal .lbn'),function(e){e.textContent=n});
}
function lbTog(k,c){LB_Sel[LB_L[k].id]=c;lbCont()}
function lbTodas(c){LB_L.forEach(function(i){LB_Sel[i.id]=c});
  Array.prototype.forEach.call(document.querySelectorAll('#lb_modal .ls input'),function(e){e.checked=c});lbCont()}
function lbCerrar(){var m=$('lb_modal');if(m)m.remove()}

function lbCargarPDF(cb){
  if(window.jspdf){cb(true);return}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload=function(){cb(!!window.jspdf)};
  s.onerror=function(){cb(false)};
  document.head.appendChild(s);
}
function lbPDF(){
  var l=lbElegidas();
  if(!l.length){$('st').textContent='Marca al menos una etiqueta';return}
  $('st').textContent='Preparando PDF…';
  lbCargarPDF(function(ok){
    if(!ok){$('st').textContent='No se pudo cargar el generador de PDF (revisa tu conexión).';return}
    try{
      var J=window.jspdf.jsPDF,doc=new J({orientation:'landscape',unit:'in',format:[4,6]});
      var cl=function(x){return String(x==null?'':x).replace(/[^\u0020-\u00FF]/g,'')};
      l.forEach(function(it,idx){
        var v=it.dvMeta;if(idx)doc.addPage([4,6],'landscape');
        doc.setDrawColor(0);doc.setTextColor(0);
        doc.setLineWidth(0.03);doc.roundedRect(0.1,0.1,5.8,3.8,0.06,0.06);
        doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text('Remitente',0.3,0.36);
        doc.setLineWidth(0.02);doc.rect(0.3,0.42,2.5,0.82);
        doc.setFontSize(7.5);doc.text('Envía: Little Nani',0.37,0.57);
        doc.setFont('helvetica','normal');
        ['Cartago, Alvarado, Cervantes','Calle Linda vista en Little Nani','Cédula 801290969','Tel: 8633-5721'].forEach(function(t,k){doc.text(t,0.37,0.7+k*0.13)});
        var ub=cl([v.provincia,v.canton,v.distrito].filter(Boolean).join(', '));
        var rows=[['Nombre:',cl(v.nombre)],['Teléfono:',cl(v.tel||'N/D')],['',ub],['Dirección:',cl(v.otrosDatos)]];
        var fs=13,lines,y0,lh;
        for(;fs>=8;fs--){
          doc.setFontSize(fs);lh=fs*1.35/72;lines=[];
          rows.forEach(function(r){
            doc.setFont('helvetica','bold');var lw=r[0]?doc.getTextWidth(r[0]+' '):0;
            doc.setFont('helvetica','normal');
            var parts=doc.splitTextToSize(r[1]||' ',5.4-lw);
            parts.forEach(function(p,k){lines.push({l:k?'':r[0],t:p,w:lw})});
          });
          y0=3.78-(0.32+lines.length*lh);
          if(y0>=1.4)break;
        }
        doc.setFont('helvetica','bold');doc.setFontSize(fs+2);doc.text('Destinatario:',3,y0+0.2,{align:'center'});
        doc.setFontSize(fs);var y=y0+0.32+lh*0.8;
        lines.forEach(function(r){
          if(r.l){doc.setFont('helvetica','bold');doc.text(r.l,0.3,y)}
          doc.setFont('helvetica','normal');doc.text(r.t,0.3+r.w,y);y+=lh;
        });
      });
      doc.save('etiquetas-little-nani-'+(DV_Q||today())+'.pdf');
      $('st').textContent='';
    }catch(e){$('st').textContent='Error al crear el PDF: '+e.message}
  });
}

function deshacerAbono(id){
  var it=S.items.filter(function(x){return x.id===id})[0];
  if(!it||!it.ap||BUSY[id]) return;
  if(!confirm('¿Deshacer el abono de ₡'+money(it.a)+' de '+abonoNombre(it)+'? Se quitará de las ventas y se devolverá al saldo del apartado.')) return;
  var cr=S.creditos.filter(function(c){return c.id===it.ap})[0];
  var b=FS.batch();
  b.delete(FS.doc(P+'items/'+id));
  if(cr) b.update(FS.doc(P+'creditos/'+cr.id),{pagado:firebase.firestore.FieldValue.increment(-Math.min(it.a,cr.pagado||0))});
  BUSY[id]=true;
  setTimeout(function(){BUSY[id]=false},8000);
  b.commit().then(function(){
    BUSY[id]=false;
    $('st').textContent='Abono deshecho'+(cr?'; el monto volvió al saldo del apartado':' (el apartado ya no existe)');
    render();
  }).catch(function(e){BUSY[id]=false;$('st').textContent='Error al deshacer el abono: '+e.message});
}

function resumenMesData(desde,hasta){
  var r={v:0,f:0,g:0};
  S.items.forEach(function(i){if(!i||!i.d||i.d<desde||i.d>hasta)return;if(i.c==='Fondo Casa')return;if(r[i.t]!==undefined)r[i.t]+=Number(i.a)||0});
  r.b=r.v-r.f-r.g;return r;
}
function resumenFlujo(desde,hasta){
  var entradas=0,salidasGastos=0,salidasFacturas=0;
  S.items.forEach(function(i){if(!i||!i.d||i.d<desde||i.d>hasta||i.c==='Fondo Casa')return;
    if(i.t==='v')entradas+=Number(i.a)||0;
    if(i.t==='g')salidasGastos+=Number(i.a)||0;
  });
  // Los abonos de facturas se cuentan en la fecha real de pago; facturas antiguas sin historial
  // de abonos se aproximan por su estado cancelado y fecha de registro.
  S.items.forEach(function(i){if(i&&i.t==='f'&&i.d>=desde&&i.d<=hasta&&!cxGet(i.id))salidasFacturas+=Number(i.a)||0});
  (S.cxp||[]).forEach(function(c){
    var ab=c.abonos||[];
    ab.forEach(function(a){if(a.f>=desde&&a.f<=hasta)salidasFacturas+=Number(a.m)||0});
    if(c.liq&&c.d>=desde&&c.d<=hasta){var rest=r2((Number(c.a)||0)-cxPagado(c));if(rest>0)salidasFacturas+=rest}
  });
  return {entradas:entradas,salidas:salidasGastos+salidasFacturas,gastos:salidasGastos,facturas:salidasFacturas,neto:entradas-salidasGastos-salidasFacturas};
}
function resumenComparacionMes(){
  var now=new Date(),inicio=new Date(now.getFullYear(),now.getMonth(),1),ayer=now.getDate();
  var fin=new Date(now.getFullYear(),now.getMonth(),ayer),prevInicio=new Date(now.getFullYear(),now.getMonth()-1,1),prevFin=new Date(now.getFullYear(),now.getMonth()-1,Math.min(ayer,new Date(now.getFullYear(),now.getMonth(),0).getDate()));
  var a=resumenMesData(iso(inicio),iso(fin)),b=resumenMesData(iso(prevInicio),iso(prevFin));
  function delta(x,y){if(!y)return x?null:0;return (x-y)/Math.abs(y)*100}
  function cmp(label,x,y){var d=delta(x,y),txt=d===null?'Sin base de comparación':(d>=0?'+':'')+d.toFixed(1)+'% vs periodo anterior';return '<div class="dash-tile"><span class="label">'+label+'</span><strong>'+money(x)+'</strong><div class="dash-change '+(d===null?'':d>=0?'up':'down')+'">'+txt+'</div><small>Anterior: '+money(y)+'</small></div>'}
  return {html:cmp('Ventas del mes',a.v,b.v)+cmp('Gastos del mes',a.g+a.f,b.g+b.f),actual:a,anterior:b,desde:iso(inicio),hasta:iso(fin)};
}
function resumenGraficoFlujo(){
  var fin=today(),weeks={};
  for(var j=0;j<5;j++){weeks[addDays(wk(fin),-7*j)]=true}
  var ks=Object.keys(weeks).sort(),html='';
  ks.forEach(function(w){var hasta=addDays(w,6);if(hasta>fin)hasta=fin;var f=resumenFlujo(w,hasta),mx=Math.max(f.entradas,f.salidas,1),hi=Math.max(3,Math.round(f.entradas/mx*100)),ho=Math.max(3,Math.round(f.salidas/mx*100));html+='<div class="dash-bar-group"><div class="dash-bar in" style="height:'+hi+'%" title="Entradas '+money(f.entradas)+'"></div><div class="dash-bar out" style="height:'+ho+'%" title="Salidas '+money(f.salidas)+'"></div><span class="dash-bar-label">'+shDot(w).slice(0,5)+'</span></div>'});
  return '<div class="dash-panel"><div class="dash-bars">'+html+'</div><div class="dash-legend"><span><i style="background:#279b79"></i>Entradas registradas</span><span><i style="background:#e19a55"></i>Salidas pagadas/registradas</span></div><p class="mu">Últimas cinco semanas. Los pagos de facturas se toman por fecha de abono cuando existe historial.</p></div>';
}
function resumenAlertas(balanceReal){

/* ===== Cuentas por pagar ===== */
function cxGet(id){return (S.cxp||[]).filter(function(c){return c.id===id})[0]}
function cxPagado(c){return r2((c.abonos||[]).reduce(function(x,a){return x+(a.m||0)},0))}
function cxSaldo(c){return Math.max(0,r2((c.a||0)-cxPagado(c)))}
function cxPend(id){var c=cxGet(id);return !!c&&!c.liq}
function cxPendList(){return (S.cxp||[]).filter(function(c){return !c.liq&&cxSaldo(c)>0}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0})}
function cxTot(L){var m=0,a=0,s=0;L.forEach(function(c){m+=c.a||0;a+=cxPagado(c);s+=cxSaldo(c)});return {m:r2(m),a:r2(a),s:r2(s)}}
function cxSet(n,msg){
  if(!S.cxp)S.cxp=[];
  var k=S.cxp.map(function(x){return x.id}).indexOf(n.id);
  if(k<0)S.cxp.push(n);else S.cxp[k]=n;
  if(DB)DB.doc(P+'cxp/'+n.id).set(n).catch(function(e){$('st').textContent='No se pudo guardar: '+e.message});
  $('st').textContent=msg||'';
  render();
}
function cxSync(it,pend){
  var r=cxGet(it.id);
  if(!r&&!pend)return;
  var n=r?Object.assign({},r):{id:it.id,abonos:[]};
  n.d=it.d;n.n=it.n||'';n.a=it.a;n.e=!!it.e;
  if(it.j)n.j=it.j;else delete n.j;
  n.liq=pend?cxSaldo(n)<=0:true;
  if(!S.cxp)S.cxp=[];
  var k=S.cxp.map(function(x){return x.id}).indexOf(n.id);
  if(k<0)S.cxp.push(n);else S.cxp[k]=n;
  if(DB)DB.doc(P+'cxp/'+n.id).set(n).catch(function(e){$('st').textContent='No se pudo guardar la cuenta por pagar: '+e.message});
}
function cxAbonar(id,full){
  var c=cxGet(id);if(!c)return;
  var sd=cxSaldo(c),m;
  if(full)m=sd;else m=parseFloat(String($('cxa_'+id).value).replace(',','.'));
  if(!(m>0)){$('st').textContent='Escribe un monto de abono válido';return}
  if(m>sd)m=sd;
  m=r2(m);
  if(!(m>0)){$('st').textContent='Esta cuenta ya está pagada';return}
  var f=(!full&&$('cxd_'+id)&&$('cxd_'+id).value)||today();
  var n=Object.assign({},c,{abonos:(c.abonos||[]).concat([{i:'ab-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),f:f,m:m}])});
  n.liq=cxSaldo(n)<=0;
  cxSet(n,n.liq?'Abono registrado. La cuenta quedó pagada':'Abono registrado');
}

  cxAbonar(id,true);

  var c=cxGet(id),a=c&&(c.abonos||[]).filter(function(x){return x.i===i})[0];if(!a)return;

var RC_Mes='';

function rcMesTxt(m){return RC_MN[+m.slice(5)-1]+' '+m.slice(0,4)}
function r2(n){return Math.round((n||0)*100)/100}
function rcDatos(m){
  var it=S.items.filter(function(i){return i&&i.d&&i.d.slice(0,7)===m}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var v=it.filter(function(i){return i.t==='v'}),f=it.filter(function(i){return i.t==='f'}),g=it.filter(function(i){return i.t==='g'&&i.c!=='Fondo Casa'});
  var tot=function(a){return r2(a.reduce(function(x,i){return x+i.a},0))};
  var fe=tot(f.filter(function(i){return i.e}));
  var cats={};g.forEach(function(i){var c=i.c||'Sin categoría';cats[c]=(cats[c]||0)+i.a});
  var provs={};f.forEach(function(i){var p=(i.n||'').trim()||'Sin proveedor',o=provs[p]||(provs[p]={ced:'',e:0,n:0});if(!o.ced&&i.j)o.ced=i.j;if(i.e)o.e+=i.a;else o.n+=i.a});
  var dias={};v.forEach(function(i){var o=dias[i.d]||(dias[i.d]={n:0,t:0});o.n++;o.t+=i.a});
  var ah=tot(g.filter(function(i){return /^Ahorro/.test(i.c||'')})),casa=tot(g.filter(function(i){return casaEsPago(i)&&!/^Ahorro/.test(i.c||'')}));

    +H('6. Cuentas por pagar pendientes (saldo al '+shDot(today())+')')
    +rcT([['Proveedor',0],['Fecha factura',0],['Monto',1],['Abonado',1],['Saldo',1]],cp.map(function(c){return [esc(c.n||'Sin proveedor'),shDot(c.d),M(c.a),M(cxPagado(c)),M(cxSaldo(c))]}),['Total','',M(ct.m),M(ct.a),M(ct.s)])
    +'<div style="margin-top:10px;font-size:11px;color:#444">Las ventas incluyen los abonos de apartados registrados en el mes. Los ahorros registrados como gasto se muestran dentro de Gastos. Las cuentas por pagar muestran el saldo vigente a la fecha de generación, no solo las del mes.</div></div>';
  return h;
}

function rcFilas(m,d){
  var o={};
  o.resumen=[['Little Nani · Reporte mensual para contabilidad'],['Mes',rcMesTxt(m)],[],['Concepto','Monto'],
    ['Ventas',d.tv],['Facturas electrónicas',d.fe],['Facturas no electrónicas',d.fn],['Total facturas',d.tf],
    ['Gastos',d.tg],['  de los cuales ahorros',d.ah],['  de los cuales gastos de la casa',d.casa],['Balance (ventas − facturas − gastos)',d.bal]];
  o.ventas=[['Fecha','Detalle','Monto']].concat(d.v.map(function(i){return [shDot(i.d),i.n||'',i.a]}),[['Total','',d.tv]]);
  o.provs=[['Proveedor','Cédula jurídica','Electrónicas','No electrónicas','Total']].concat(
    Object.keys(d.provs).sort().map(function(p){var x=d.provs[p];return [p,x.ced,r2(x.e),r2(x.n),r2(x.e+x.n)]}),[['Total','',d.fe,d.fn,d.tf]]);
  o.facturas=[['Fecha','Proveedor','Cédula jurídica','Tipo','Monto']].concat(d.f.map(function(i){return [shDot(i.d),i.n||'Sin proveedor',i.j||'',i.e?'Electrónica':'No electrónica',i.a]}),[['Total','','','',d.tf]]);
  o.cats=[['Categoría','Monto']].concat(Object.keys(d.cats).sort(function(a,b){return d.cats[b]-d.cats[a]}).map(function(c){return [c,r2(d.cats[c])]}),[['Total',d.tg]]);
  o.gastos=[['Fecha','Concepto','Categoría','Monto']].concat(d.g.map(function(i){return [shDot(i.d),i.n||'',i.c||'Sin categoría',i.a]}),[['Total','','',d.tg]]);
  var cp=cxPendList(),ct=cxTot(cp);
  o.cxp=[['Proveedor','Fecha factura','Monto','Abonado','Saldo']].concat(cp.map(function(c){return [c.n||'Sin proveedor',shDot(c.d),c.a,cxPagado(c),cxSaldo(c)]}),[['Total','',ct.m,ct.a,ct.s]]);
  return o;
}
function rcCSV(m,d){
  var o=rcFilas(m,d),q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'},rows=[];
  [['RESUMEN','resumen'],['VENTAS','ventas'],['FACTURAS POR PROVEEDOR','provs'],['DETALLE DE FACTURAS','facturas'],['GASTOS POR CATEGORÍA','cats'],['DETALLE DE GASTOS','gastos'],['CUENTAS POR PAGAR PENDIENTES','cxp']].forEach(function(s){
    rows.push([s[0]]);o[s[1]].forEach(function(r){rows.push(r)});rows.push([]);
  });
  var b=new Blob(['\ufeff'+rows.map(function(r){return r.map(q).join(',')}).join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='reporte-contador-little-nani-'+m+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}
function rcCargarXLSX(cb){
  if(window.XLSX){cb(true);return}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){cb(!!window.XLSX)};
  s.onerror=function(){cb(false)};
  document.head.appendChild(s);
}
function rcExcel(){
  var m=rcMes(),d=rcDatos(m);
  $('st').textContent='Preparando Excel…';
  rcCargarXLSX(function(ok){
    if(!ok){$('st').textContent='No se pudo cargar el generador de Excel (revisa tu conexión). Se descargó en CSV.';rcCSV(m,d);return}
    try{
      var o=rcFilas(m,d),wb=XLSX.utils.book_new();
      [['Resumen','resumen',[38,16]],['Ventas','ventas',[12,50,16]],['Facturas por proveedor','provs',[34,18,16,18,16]],['Detalle facturas','facturas',[12,34,18,18,16]],['Gastos por categoría','cats',[28,16]],['Detalle gastos','gastos',[12,40,22,16]],['Cuentas por pagar','cxp',[34,14,16,16,16]]].forEach(function(s){
        var ws=XLSX.utils.aoa_to_sheet(o[s[1]]);
        ws['!cols']=s[2].map(function(w){return {wch:w}});
        XLSX.utils.book_append_sheet(wb,ws,s[0]);
      });
      XLSX.writeFile(wb,'reporte-contador-little-nani-'+m+'.xlsx');
      $('st').textContent='';
    }catch(e){$('st').textContent='Error al crear el Excel: '+e.message+'. Se descargó en CSV.';rcCSV(m,d)}
  });
}
function reporteContadorCard(){
  return '<div class="card"><b>📑 Reporte mensual para el contador</b>'

var PH={v:'Nota (opcional)',f:'Proveedor (elige o escribe uno nuevo)',g:'Concepto del gasto'};
var TT={v:'Ventas diarias',f:'Facturas',g:'Gastos'};
function section(t,wi){
  var E=ed?S.items.filter(function(i){return i.id===ed})[0]:null;if(E&&E.t!==t)E=null;var dd=E?E.d:W===wk(today())?today():W;
  var list=wi.filter(function(i){return i.t===t&&!i.dvMeta}).sort(function(a,b){return a.d<b.d?1:-1});
  var tot=list.reduce(function(x,i){return x+i.a},0);
  var h='<div class="card"><div class="row"><input type="date" id="d" value="'+dd+'"><input type="number" id="a" inputmode="decimal" step="0.01" min="0" placeholder="Monto" value="'+(E?E.a:'')+'"><input id="n" placeholder="'+PH[t]+'" value="'+(E?esc(E.n):'')+'"'+(t==='f'?' list="pv" autocomplete="off"':'')+'></div>'+(t==='f'?'<datalist id="pv">'+PV().slice(1).map(function(p){return '<option value="'+esc(p[1])+'">'}).join('')+'</datalist>':'')+(t==='f'?'<input id="j" inputmode="numeric" maxlength="20" placeholder="Cédula jurídica (opcional)" value="'+(E&&E.j?esc(E.j):'')+'">':'')+(t==='g'?'<select id="c">'+CATS.filter(function(c){return c!=='Fondo Casa'||(E&&E.c==='Fondo Casa')}).map(function(c){return '<option'+(E&&E.c===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>':'')
    +(t==='f'?'<label class="chk"><input type="checkbox" id="e"'+(E&&E.e?' checked':'')+'> Factura electrónica</label><label class="chk"><input type="checkbox" id="cn"'+(E&&cxPend(E.id)?'':' checked')+'> Factura cancelada (pagada). Desmárcala si queda pendiente de pago</label>':'')
    +'<button type="button" class="pri" onclick="add(\''+t+'\')">'+(E?'Guardar cambios':'Agregar')+'</button>'+(E?'<button type="button" class="pri" style="margin-top:8px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="ed=null;render()">Cancelar</button>':'')+'</div>';
  if(RO)h='<p class="mu">Solo lectura: tu acceso no permite registrar ni modificar movimientos.</p>';h+='<h2>'+TT[t]+' de la semana · '+money(tot)+'</h2><div class="card">';
  if(!list.length)h+='<p class="mu" style="margin:4px 0">Sin registros esta semana.</p>';
  list.forEach(function(i){
    h+='<div class="it"><div class="t"><b>'+money(i.a)+'</b>'
      +'<small>'+shDot(i.d)+(i.n?' · '+esc(i.n):'')+(t==='f'?' · '+(i.e?'Electrónica':'No electrónica')+(cxPend(i.id)?' · ⏳ Pendiente de pago':''):'')+(t==='g'?' · '+esc(i.c):'')+(t==='f'&&i.j?' · Céd. '+esc(i.j):'')+'</small></div>'
      +'<button onclick="eds(\''+i.id+'\')">Editar</button><button onclick="del(\''+i.id+'\')">'+(pend===i.id?'¿Seguro?':'✕')+'</button></div>';
  });
  h+='</div>';
  if(t==='f'){var cxn=cxPendList().length;h='<button type="button" class="pri" style="margin-bottom:10px;background:none;color:var(--tx);border:1px solid var(--bd)" onclick="go(\'cx\')">💳 Cuentas x Pagar'+(cxn?' ('+cxn+' pendiente'+(cxn===1?'':'s')+')':'')+'</button>'+h}
  if(t==='g'){h='<button type="button" class="pri" style="margin-bottom:10px;background:var(--ac)" onclick="go(\'gc\')">🏠 Gastos de la Casa</button>'+h}
  return h;
}

  h+=tab==='r'?summary(wi):tab==='b'?search():tab==='ah'?ahorrosSection():tab==='cr'?creditosSection():tab==='dv'?detallesVentasSection():tab==='ct'?cotizacionesSection():tab==='cx'?cxSection():tab==='gc'?gastosCasaSection():section(tab,wi);
  root.className=RO?'ro':'';root.innerHTML=h;
